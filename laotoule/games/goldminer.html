<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>黄金矿工 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
html,body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
#turn{font-size:1.15rem;font-weight:800;text-align:center;margin:2px 0 4px}
#frame{position:relative;width:min(96vw,560px);margin:0 auto}
canvas{width:100%;height:auto;background:#87ceeb;border:4px solid #222;border-radius:16px;display:block;touch-action:none}
.playbar{position:sticky;bottom:0;z-index:6;display:flex;gap:8px;padding:8px 4px 10px;margin-top:8px;background:rgba(255,247,230,.96);border-top:3px solid #222}
.playbar .btn{min-height:64px;font-size:1.45rem;flex:1}
#drop{flex:2}
#stage{position:relative}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>⛏️ 黄金矿工</h1></div>
<div class="wrap">
<div class="stats"><div class="stat"><span>本关</span><b id="got">0</b></div><div class="stat"><span>关卡</span><b id="goal">1</b></div><div class="stat"><span>时间</span><b id="time">0</b></div><div class="stat"><span>最高</span><b id="best">0</b></div></div>
<div id="turn">点屏幕或「放钩」</div>
<div id="stage"><div id="frame"><canvas id="cv" width="360" height="420"></canvas></div><div class="overlay" id="ov"><div id="ovt"></div><button class="btn green" id="again" type="button">继续</button></div></div>
<div class="playbar"><button class="btn green" id="drop" type="button">放钩</button><button class="btn" id="new" type="button">从头</button></div>
<div class="help"><h2>📖 怎么玩</h2><ul>
<li>钩子自己左右摆。点画面或大按钮「放钩」，钩子落下，勾到金子、石头或宝石就拉回来。</li>
<li>越重拉得越慢。在时间结束前达到目标分就过关。石头分少又重，宝石又轻又值钱。</li>
<li>画面都是简单图形，自己画的。最高分会记住。</li>
</ul></div>
</div>
<script src="../common.js"></script>
<script>
const LEVELS=[
  {name:'浅滩',time:50,goal:500,items:[
    {x:50,y:46,r:18,kind:'gold',v:200,w:2},{x:24,y:62,r:11,kind:'gold',v:100,w:1.5},
    {x:78,y:60,r:14,kind:'gold',v:180,w:2.4},{x:16,y:82,r:12,kind:'rock',v:20,w:5},
    {x:84,y:84,r:13,kind:'rock',v:20,w:5},{x:50,y:78,r:7,kind:'gem',v:400,w:.6}]},
  {name:'散金',time:50,goal:700,items:[
    {x:32,y:44,r:9,kind:'gold',v:80,w:1},{x:68,y:42,r:9,kind:'gold',v:80,w:1},
    {x:50,y:62,r:16,kind:'gold',v:250,w:3.2},{x:22,y:74,r:8,kind:'bag',v:150,w:1},
    {x:80,y:76,r:14,kind:'rock',v:20,w:6},{x:40,y:86,r:6,kind:'gem',v:350,w:.5}]},
  {name:'岩层',time:55,goal:800,items:[
    {x:30,y:48,r:12,kind:'rock',v:30,w:5},{x:70,y:50,r:12,kind:'rock',v:30,w:5},
    {x:50,y:68,r:15,kind:'gold',v:280,w:3},{x:18,y:78,r:10,kind:'gold',v:120,w:1.6},
    {x:84,y:74,r:10,kind:'gold',v:120,w:1.6},{x:50,y:40,r:6,kind:'gem',v:400,w:.5}]},
  {name:'口袋',time:48,goal:750,items:[
    {x:28,y:50,r:9,kind:'bag',v:200,w:1.2},{x:72,y:50,r:9,kind:'bag',v:200,w:1.2},
    {x:50,y:64,r:12,kind:'gold',v:160,w:2},{x:16,y:80,r:11,kind:'rock',v:20,w:5},
    {x:84,y:82,r:11,kind:'rock',v:20,w:5},{x:50,y:84,r:8,kind:'gem',v:450,w:.7}]},
  {name:'深井',time:50,goal:900,items:[
    {x:50,y:40,r:8,kind:'gold',v:70,w:1},{x:36,y:58,r:13,kind:'gold',v:200,w:2.6},
    {x:66,y:60,r:13,kind:'gold',v:200,w:2.6},{x:20,y:78,r:14,kind:'rock',v:20,w:6},
    {x:80,y:76,r:14,kind:'rock',v:20,w:6},{x:50,y:86,r:7,kind:'gem',v:500,w:.6}]},
  {name:'宝石洞',time:46,goal:1000,items:[
    {x:26,y:46,r:6,kind:'gem',v:350,w:.5},{x:74,y:48,r:6,kind:'gem',v:350,w:.5},
    {x:50,y:62,r:8,kind:'gem',v:450,w:.6},{x:18,y:70,r:12,kind:'rock',v:20,w:5},
    {x:82,y:72,r:12,kind:'rock',v:20,w:5},{x:50,y:82,r:14,kind:'gold',v:220,w:3}]},
  {name:'大块头',time:55,goal:1100,items:[
    {x:50,y:55,r:22,kind:'gold',v:500,w:6},{x:22,y:78,r:10,kind:'gold',v:100,w:1.4},
    {x:80,y:76,r:10,kind:'gold',v:100,w:1.4},{x:36,y:40,r:8,kind:'rock',v:20,w:4},
    {x:64,y:40,r:8,kind:'rock',v:20,w:4},{x:50,y:86,r:6,kind:'gem',v:400,w:.5}]},
  {name:'收工',time:48,goal:1200,items:[
    {x:30,y:44,r:10,kind:'gold',v:120,w:1.5},{x:70,y:44,r:10,kind:'gold',v:120,w:1.5},
    {x:50,y:60,r:12,kind:'bag',v:300,w:1.3},{x:18,y:72,r:9,kind:'gem',v:400,w:.6},
    {x:82,y:74,r:13,kind:'rock',v:30,w:6},{x:48,y:84,r:15,kind:'gold',v:280,w:3.5}]}
];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let level,items,got,bank,timeLeft,ang,dir,len,state,hold,running,lastTs,raf,mode;
const MINL=28;
function bestEl(){document.getElementById('best').textContent=localStorage.getItem('laotoule:gold')||'0'}
function saveBest(){const b=Number(localStorage.getItem('laotoule:gold')||0);if(bank+got>b)localStorage.setItem('laotoule:gold',String(bank+got));bestEl()}
function save(){localStorage.setItem('laotoule:goldState',JSON.stringify({level,bank}));saveBest()}
function tip(){
  const W=cv.width,H=cv.height,cx=W/2,cy=36;
  return {x:cx+Math.sin(ang)*len,y:cy+Math.cos(ang)*len,cx,cy};
}
function place(){
  const L=LEVELS[level];
  items=L.items.map(it=>({...it,gone:false}));
  got=0;timeLeft=L.time;hold=null;ang=-0.2;dir=1;len=MINL;state='swing';
  document.getElementById('goal').textContent=L.goal;
  document.getElementById('turn').textContent=L.name+' · 钩到目标分就过关';
}
function startAt(i,keepBank){
  level=Math.max(0,Math.min(LEVELS.length-1,i));
  if(!keepBank)bank=0;
  place();running=true;mode='play';ov.classList.remove('show');
  save();paintHud();
}
function paintHud(){
  document.getElementById('got').textContent=got+'/'+LEVELS[level].goal;
  document.getElementById('time').textContent=Math.max(0,Math.ceil(timeLeft));
  document.getElementById('goal').textContent=(level+1)+'/'+LEVELS.length;
}
function openOv(text,label){
  running=false;mode='pause';
  document.getElementById('ovt').textContent=text;
  document.getElementById('again').textContent=label;
  ov.classList.add('show');
}
function drop(){
  if(!running||state!=='swing')return;
  state='out';LTL.beep(440,.05,'square',.04);
}
function tick(dt){
  if(!running)return;
  timeLeft-=dt;
  if(state==='swing'){
    ang+=dir*0.9*dt;
    if(ang>1.05){ang=1.05;dir=-1}
    if(ang<-1.05){ang=-1.05;dir=1}
  }else if(state==='out'){
    len+=260*dt;
    const p=tip();
    for(const it of items){
      if(it.gone)continue;
      const ix=it.x/100*cv.width,iy=it.y/100*cv.height;
      const dx=p.x-ix,dy=p.y-iy,rr=it.r/100*cv.width+10;
      if(dx*dx+dy*dy<rr*rr){hold=it;state='back';LTL.beep(300,.06,'sawtooth',.05);break}
    }
    if(len>cv.height-24)state='back';
  }else if(state==='back'){
    const w=hold?hold.w:0.35;
    len-=(200/(0.55+w))*dt;
    if(len<=MINL){
      len=MINL;state='swing';
      if(hold&&!hold.gone){got+=hold.v;hold.gone=true;LTL.beep(720,.08,'triangle',.06);saveBest()}
      hold=null;
      if(got>=LEVELS[level].goal)return clearLevel();
    }
  }
  if(timeLeft<=0){
    saveBest();
    openOv('时间到了，本关 '+got+' 分','再试这一关');
  }
}
function clearLevel(){
  saveBest();bank+=got;save();
  if(level>=LEVELS.length-1){openOv('八关都过了！总分 '+bank,'再来一次');mode='all';return}
  openOv(LEVELS[level].name+' 过关！下一关','下一关');mode='next';
}
function frame(ts){
  const dt=Math.min(0.05,((ts-(lastTs||ts))/1000)||0.016);lastTs=ts;
  tick(dt);draw();paintHud();
  raf=requestAnimationFrame(frame);
}
function drawItem(it,x,y,r){
  ctx.save();ctx.translate(x,y);
  if(it.kind==='gold'){
    ctx.fillStyle='#f59f00';ctx.beginPath();ctx.ellipse(0,0,r,r*.82,0,0,7);ctx.fill();
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.ellipse(-r*.2,-r*.15,r*.45,r*.32,0,0,7);ctx.fill();
  }else if(it.kind==='rock'){
    ctx.fillStyle='#868e96';ctx.beginPath();
    ctx.moveTo(-r,0);ctx.lineTo(-r*.4,-r*.8);ctx.lineTo(r*.5,-r*.6);ctx.lineTo(r,r*.1);ctx.lineTo(r*.2,r*.8);ctx.lineTo(-r*.6,r*.5);ctx.closePath();ctx.fill();
  }else if(it.kind==='gem'){
    ctx.fillStyle='#22b8cf';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.7,0);ctx.lineTo(0,r);ctx.lineTo(-r*.7,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e3fafc';ctx.beginPath();ctx.moveTo(0,-r*.4);ctx.lineTo(r*.25,0);ctx.lineTo(0,r*.15);ctx.closePath();ctx.fill();
  }else{
    ctx.fillStyle='#e67700';ctx.fillRect(-r*.7,-r*.5,r*1.4,r);ctx.fillStyle='#fab005';ctx.fillRect(-r*.7,-r*.7,r*1.4,r*.35);
  }
  ctx.restore();
}
function draw(){
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H*.42);
  sky.addColorStop(0,'#74c0fc');sky.addColorStop(1,'#ffd8a8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.36);
  ctx.fillStyle='#c92a2a';ctx.fillRect(W/2-28,8,56,22);
  ctx.fillStyle='#fff';ctx.fillRect(W/2-22,12,44,8);
  ctx.fillStyle='#895200';ctx.fillRect(0,H*.34,W,H*.66);
  ctx.fillStyle='#693d12';ctx.fillRect(0,H*.34,W,10);
  const p=tip();
  for(const it of items){
    if(it.gone)continue;
    if(hold&&it===hold)continue;
    drawItem(it,it.x/100*W,it.y/100*H,it.r/100*W);
  }
  ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.cx,p.cy);ctx.lineTo(p.x,p.y);ctx.stroke();
  ctx.fillStyle='#495057';ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();
  ctx.strokeStyle='#212529';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(p.x,p.y,12,0.2,2.4);ctx.stroke();
  ctx.beginPath();ctx.arc(p.x,p.y,12,-2.4,-0.2);ctx.stroke();
  if(hold&&!hold.gone)drawItem(hold,p.x,p.y+hold.r/100*W*0.8,hold.r/100*W);
}
document.getElementById('drop').onclick=drop;
cv.addEventListener('pointerdown',e=>{e.preventDefault();drop()});
document.getElementById('new').onclick=()=>startAt(0,false);
document.getElementById('again').onclick=()=>{
  if(mode==='next')startAt(level+1,true);
  else if(mode==='all')startAt(0,false);
  else startAt(level,true);
};
bestEl();
bank=0;
try{
  const s=JSON.parse(localStorage.getItem('laotoule:goldState')||'null');
  if(s&&typeof s.level==='number')bank=Number(s.bank)||0;
  startAt(s&&typeof s.level==='number'?s.level:0,true);
}catch(e){startAt(0,false)}
cancelAnimationFrame(raf);
raf=requestAnimationFrame(frame);
</script></body></html>
