<div class="wrap"><div class="help"><h2>怎么玩</h2><ul>
<li>这是别人做好的第一人称成品，请用电脑。</li>
<li>点 ENTER 进入。W A S D 移动，鼠标瞄准，左键开枪，右键瞄准镜，R 换弹，Shift 冲刺，空格跳。</li>
<li>Esc 暂停。G 切换画面，M 静音。</li>
<li>手机没有键盘和鼠标瞄准，这一款在手机上玩不了。</li>
