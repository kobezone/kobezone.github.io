<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>飞镖忍者 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
#stage{position:relative;width:min(96vw,640px);height:min(42vh,280px);margin:0 auto;border:3px solid #222;border-radius:16px;overflow:hidden;background:#d0ebff;touch-action:none;box-shadow:0 6px 0 #222}
#cv{width:100%;height:100%;display:block}
.pad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pad .btn{min-width:96px;min-height:64px;font-size:1.25rem}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>🥷 飞镖忍者</h1></div>
<div class="wrap">
<div class="stats">
  <div class="stat"><span>生命</span><b id="hp">5</b></div>
  <div class="stat"><span>关卡</span><b id="lv">1</b></div>
  <div class="stat"><span>分数</span><b id="score">0</b></div>
  <div class="stat"><span>最高关</span><b id="best">0</b></div>
</div>
<div id="stage"><canvas id="cv"></canvas>
<div class="overlay" id="ov"><div id="ovt"></div><button class="btn" id="again">继续</button></div></div>
<div class="pad">
  <button class="btn blue" id="left" type="button">⬅</button>
  <button class="btn blue" id="right" type="button">➡</button>
  <button class="btn green" id="jump" type="button">跳</button>
  <button class="btn" id="throw" type="button">丢镖</button>
</div>
<div class="help"><h2>📖 怎么玩</h2><ul>
<li>左右移动，<b>跳</b>过缺口。<b>丢镖</b>或按 J / 空格扔出手里剑。</li>
<li>木头人来回走，稻草人会丢慢镖，青蛙会跳。碰到会掉血，中招后有一小段撞不倒的时间。</li>
<li>每关尽头有一个<b>被困的小朋友</b>，走到身边就算救到。一共 5 关，节奏放慢了。</li>
</ul></div>
</div>
<script src="../common.js"></script>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stageEl=document.getElementById('stage');
const GRAV=1100,JUMP=-460,SPEED=150;
function makeStages(){
  const S=[];
  // 1 flat
  S.push({w:1700,plats:[{x:0,y:400,w:1700,h:60}],foes:[{x:420,type:'walk'},{x:860,type:'walk'}],goal:1500});
  // 2 gap + step
  S.push({w:1900,plats:[{x:0,y:400,w:520,h:80},{x:680,y:400,w:1220,h:80},{x:500,y:300,w:200,h:24}],foes:[{x:300,type:'walk'},{x:980,type:'throw'}],goal:1700});
  // 3 stairs
  S.push({w:2000,plats:[{x:0,y:420,w:420,h:80},{x:500,y:340,w:280,h:24},{x:860,y:270,w:280,h:24},{x:1220,y:400,w:780,h:80}],foes:[{x:600,type:'hop'},{x:1400,type:'walk'}],goal:1800});
  // 4 pits and throwers
  S.push({w:2100,plats:[{x:0,y:400,w:360,h:80},{x:520,y:360,w:300,h:24},{x:960,y:400,w:340,h:80},{x:1460,y:320,w:260,h:24},{x:1800,y:400,w:300,h:80}],foes:[{x:200,type:'walk'},{x:1040,type:'throw'},{x:1600,type:'hop'}],goal:1920});
  // 5 mix
  S.push({w:2200,plats:[{x:0,y:410,w:300,h:70},{x:420,y:330,w:220,h:22},{x:760,y:410,w:280,h:70},{x:1160,y:300,w:240,h:22},{x:1500,y:400,w:700,h:80}],foes:[{x:180,type:'walk'},{x:860,type:'throw'},{x:1280,type:'hop'},{x:1680,type:'walk'}],goal:2050});
  return S;
}
const STAGES=makeStages();
let si=0,player,foes,shots,enemyShots,cam=0,score=0,over=false,hp=5,viewW=480,viewH=280;
const keys={};
function resetStage(i){
  si=i; const s=STAGES[i];
  player={x:40,y:s.plats[0].y-48,vx:0,vy:0,w:36,h:48,ifr:1.2,face:1,cool:0,ground:false};
  foes=s.foes.map(f=>{
    const plat=s.plats.find(p=>f.x>=p.x && f.x<=p.x+p.w) || s.plats[0];
    return {x:f.x,y:plat.y-40,w:36,h:40,type:f.type,dir:1,vx:40,cool:1.2,alive:true,vy:0};
  });
  shots=[]; enemyShots=[]; over=false; hp=5;
  document.getElementById('lv').textContent=i+1;
  document.getElementById('hp').textContent=hp;
  document.getElementById('ov').classList.remove('show');
}
function goalPlat(){
  const s=STAGES[si];
  let best=null;
  for(const pl of s.plats){
    if(s.goal>=pl.x && s.goal<=pl.x+pl.w && (!best || pl.y>best.y)) best=pl;
  }
  return best || s.plats[s.plats.length-1];
}
function overlap(a,b,pad=0){
  return a.x<b.x+b.w+pad && a.x+a.w+pad>b.x && a.y<b.y+b.h+pad && a.y+a.h+pad>b.y;
}
function landOn(ent,plats){
  if(ent.vy<0) return false;
  for(const pl of plats){
    const feet=ent.y+ent.h, prev=feet-ent.vy*(1/60)-1;
    if(ent.x+ent.w-6>pl.x && ent.x+6<pl.x+pl.w && prev<=pl.y+6 && feet>=pl.y && feet<=pl.y+28){
      ent.y=pl.y-ent.h; ent.vy=0; return true;
    }
  }
  return false;
}
function jump(){ if(player.ground && !over){ player.vy=JUMP; player.ground=false; LTL.beep(420,.06,'square',.03)} }
function toss(){
  if(over||player.cool>0) return;
  shots.push({x:player.x+(player.face>0?player.w: -8), y:player.y+16, vx:280*player.face, w:16, h:10});
  player.cool=.45; LTL.beep(760,.04,'triangle',.03);
}
function hitPlayer(){
  if(player.ifr>0||over) return;
  hp--; player.ifr=1.3; document.getElementById('hp').textContent=Math.max(0,hp);
  LTL.beep(140,.12,'sawtooth',.05);
  if(hp<=0){over=true; document.getElementById('ovt').textContent='被碰到了，这一关再试一次'; document.getElementById('again').textContent='重试'; document.getElementById('ov').classList.add('show')}
}
function update(dt){
  if(over) return;
  const plats=STAGES[si].plats;
  player.cool=Math.max(0,player.cool-dt); player.ifr=Math.max(0,player.ifr-dt);
  let dir=0;
  if(keys.ArrowLeft||keys.a||held.has('l')) dir=-1;
  if(keys.ArrowRight||keys.d||held.has('r')) dir=1;
  if(dir) player.face=dir;
  player.vx=dir*SPEED;
  player.x+=player.vx*dt;
  player.x=Math.max(0,Math.min(STAGES[si].w-player.w,player.x));
  player.vy+=GRAV*dt; player.y+=player.vy*dt;
  player.ground=landOn(player,plats);
  if(player.y>560) hitPlayer(), player.y=plats[0].y-player.h, player.x=40, player.vy=0;
  foes.forEach(f=>{
    if(!f.alive) return;
    f.cool-=dt;
    if(f.type==='walk'){
      const nx=f.x+f.dir*50*dt;
      const front=nx+(f.dir>0?f.w+4: -4);
      const supported=plats.some(pl=>front>=pl.x && front<=pl.x+pl.w && Math.abs((f.y+f.h)-pl.y)<8);
      if(!supported) f.dir*=-1; else f.x=nx;
    } else if(f.type==='hop'){
      f.vy+=GRAV*dt; f.y+=f.vy*dt;
      if(landOn(f,plats) && f.cool<=0){ f.vy=JUMP*.75; f.cool=1.6 }
      f.x+=f.dir*30*dt;
      if(f.x<20||f.x>STAGES[si].w-60) f.dir*=-1;
    } else if(f.type==='throw' && f.cool<=0 && Math.abs(f.x-player.x)<460){
      const dir=player.x>f.x?1:-1;
      enemyShots.push({x:f.x,y:f.y+12,vx:dir*160,w:14,h:8});
      f.cool=2.1;
    }
    if(overlap(player,f,-6)) hitPlayer();
  });
  shots.forEach(s=>{s.x+=s.vx*dt});
  shots=shots.filter(s=>{
    if(s.x<cam-40||s.x>cam+viewW+80) return false;
    for(const f of foes) if(f.alive && overlap(s,f,10)){ f.alive=false; score+=100; document.getElementById('score').textContent=score; LTL.beep(300,.06,'square',.04); return false }
    return true;
  });
  enemyShots.forEach(s=>{s.x+=s.vx*dt});
  enemyShots=enemyShots.filter(s=>{
    if(overlap(s,player,4)){ hitPlayer(); return false }
    return s.x>-20 && s.x<STAGES[si].w+20;
  });
  const gp=goalPlat();
  const goal={x:STAGES[si].goal,y:gp.y-56,w:40,h:56};
  if(overlap(player,goal,8)){
    over=true; score+=200; document.getElementById('score').textContent=score;
    if(LTL.record('ninja',si+1)) document.getElementById('best').textContent=si+1;
    document.getElementById('ovt').textContent=si>=4?'小朋友都救到了！':'救到了！下一关';
    document.getElementById('again').textContent=si>=4?'再玩一次':'下一关';
    document.getElementById('ov').classList.add('show');
    LTL.beep(640,.12,'triangle',.06);
  }
  cam=Math.max(0,Math.min(STAGES[si].w-viewW, player.x-viewW*.35));
}
function drawNinja(x,y,face,color){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=color; ctx.fillRect(6,16,24,28);
  ctx.fillStyle='#ffe8cc'; ctx.fillRect(8,2,20,16);
  ctx.fillStyle='#222'; ctx.fillRect(face>0?20:8,8,6,4);
  ctx.fillStyle='#fa5252'; ctx.fillRect(6,6,24,4);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const sx=cv.width/viewW, sy=cv.height/viewH;
  ctx.setTransform(sx,0,0,sy,0,0);
  ctx.fillStyle='#d0ebff'; ctx.fillRect(0,0,viewW,viewH);
  ctx.translate(-cam,0);
  ctx.fillStyle='#8ce99a';
  STAGES[si].plats.forEach(pl=>ctx.fillRect(pl.x,pl.y,pl.w,pl.h));
  foes.forEach(f=>{
    if(!f.alive) return;
    ctx.fillStyle=f.type==='throw'?'#ffd43b':f.type==='hop'?'#b2f2bb':'#ffc078';
    ctx.fillRect(f.x,f.y,f.w,f.h);
    ctx.fillStyle='#222'; ctx.font='12px sans-serif'; ctx.fillText(f.type==='throw'?'草':f.type==='hop'?'蛙':'木', f.x+8, f.y+24);
  });
  const gp=goalPlat();
  ctx.fillStyle='#ffd43b'; ctx.fillRect(STAGES[si].goal, gp.y-56, 36, 50);
  ctx.fillStyle='#222'; ctx.font='14px sans-serif'; ctx.fillText('小孩', STAGES[si].goal+2, gp.y-28);
  if(player.ifr<=0 || Math.floor(performance.now()/100)%2===0) drawNinja(player.x,player.y,player.face,'#5c7cfa');
  ctx.fillStyle='#222';
  shots.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));
  ctx.fillStyle='#e03131';
  enemyShots.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));
  ctx.setTransform(1,0,0,1,0,0);
}
let last=performance.now();
function frame(now){ const dt=Math.min(.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(frame) }
function resize(){
  const r=stageEl.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(200,Math.round(r.width*dpr));
  cv.height=Math.max(120,Math.round(r.height*dpr));
  viewW=480; viewH=480*(r.height/Math.max(1,r.width));
}
const held=new Set();
function hold(btn,k){
  const on=e=>{e.preventDefault(); held.add(k)};
  btn.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>held.delete(k)));
}
hold(document.getElementById('left'),'l');
hold(document.getElementById('right'),'r');
document.getElementById('jump').onclick=jump;
document.getElementById('throw').onclick=toss;
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','j','J'].includes(e.key)) e.preventDefault();
  keys[e.key]=true;
  if((e.key==='ArrowUp'||e.key==='w'||e.key==='W')&&!e.repeat) jump();
  if((e.key===' '||e.key==='j'||e.key==='J')&&!e.repeat) toss();
});
addEventListener('keyup',e=>{keys[e.key]=false});
document.getElementById('again').onclick=()=>{
  if(hp<=0){resetStage(si); return}
  if(si>=4){score=0; document.getElementById('score').textContent=0; resetStage(0); return}
  resetStage(si+1);
};
new ResizeObserver(resize).observe(stageEl);
document.getElementById('best').textContent=LTL.getBest('ninja');
resetStage(0); resize(); requestAnimationFrame(frame);
window.__TEST={
  jump, toss,
  player:()=>({x:player.x,y:player.y,vy:player.vy,ground:player.ground,hp}),
  shots:()=>shots.length,
  stage:()=>si+1,
  foes:()=>foes.filter(f=>f.alive).length
};
</script></body></html>
