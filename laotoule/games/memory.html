<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>记忆翻牌 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
#cards{position:relative;display:grid;gap:10px;max-width:600px;margin:0 auto}
.card{aspect-ratio:3/4;perspective:600px;cursor:pointer;border:none;background:none;padding:0}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.f .in,.card.m .in{transform:rotateY(180deg)}
.fa,.ba{position:absolute;inset:0;border:3px solid #222;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.fa{background:repeating-linear-gradient(45deg,#e8590c 0 10px,#fd7e14 10px 20px);font-size:2rem;color:#fff}
.ba{background:#fff;transform:rotateY(180deg);font-size:clamp(1.8rem,9vw,3.2rem)}
.card.m .ba{background:#d3f9d8}
.card:focus-visible{outline:4px solid #1971c2;border-radius:12px}
.lv .btn.on{background:#e8590c;color:#fff}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>🃏 记忆翻牌</h1></div>
<div class="wrap">
<div class="controls lv"><button class="btn" data-n="6">简单 12 张</button><button class="btn" data-n="8">中等 16 张</button><button class="btn" data-n="10">困难 20 张</button></div>
<div class="stats"><div class="stat"><span>翻牌步数</span><b id="moves">0</b></div><div class="stat"><span>已配对</span><b id="pairs">0</b></div><div class="stat"><span>最少步数</span><b id="best">-</b></div></div>
<div style="position:relative"><div id="cards"></div><div class="overlay" id="ov" style="border-radius:16px"><div id="ovt"></div><button class="btn" id="again">再玩一次</button></div></div>
<div class="controls"><button class="btn green" id="new">🔄 重新洗牌</button></div>
<div class="help"><h2>📖 怎么玩</h2><ul><li>每次<b>翻开两张</b>牌，图案一样就配对成功，牌保持翻开。</li><li>不一样会自动翻回去，记住它们的位置！</li><li>全部配对成功就赢啦，步数越少越厉害。键盘可用 <b>Tab</b> 选牌、<b>回车</b> 翻牌。</li></ul></div>
</div>
<script src="../common.js"></script>
<script>
const EM=['🍎','🍊','🍌','🍇','🍉','🍓','🍑','🍒','🥝','🍍','🌻','🐼'];
let n=Number(localStorage.getItem('laotoule:memN')||6),deck,flipped,moves,matched,lock;
const box=document.getElementById('cards');
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=Number(b.dataset.n);localStorage.setItem('laotoule:memN',n);init()});
function init(){document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',Number(b.dataset.n)===n));
  const em=EM.slice().sort(()=>Math.random()-.5).slice(0,n);deck=[...em,...em];for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
  flipped=[];moves=0;matched=0;lock=false;const cols=n===6?4:n===8?4:5;box.style.gridTemplateColumns=`repeat(${cols},1fr)`;box.innerHTML='';
  deck.forEach((e,i)=>{const c=document.createElement('button');c.className='card';c.setAttribute('aria-label','第'+(i+1)+'张牌');c.innerHTML=`<div class="in"><div class="fa">?</div><div class="ba">${e}</div></div>`;c.onclick=()=>flip(i,c);box.appendChild(c)});
  document.getElementById('ov').classList.remove('show');upd()}
function upd(){document.getElementById('moves').textContent=moves;document.getElementById('pairs').textContent=matched+' / '+n;const b=LTL.getBest('mem'+n,-1);document.getElementById('best').textContent=b<0?'-':b}
function flip(i,c){if(lock||c.classList.contains('f')||c.classList.contains('m'))return;c.classList.add('f');LTL.beep(500,.05);flipped.push([i,c]);
  if(flipped.length===2){moves++;const[[a,ca],[b2,cb]]=flipped;if(deck[a]===deck[b2]){setTimeout(()=>{ca.classList.add('m');cb.classList.add('m');LTL.beep(880,.1,'triangle')},250);matched++;flipped=[];
      if(matched===n){const rec=LTL.record('mem'+n,moves,false);setTimeout(()=>{[523,659,784,1046].forEach((f,k)=>setTimeout(()=>LTL.beep(f,.12,'triangle'),k*120));document.getElementById('ovt').textContent=(rec?'🏆 新纪录！':'🎉 全部配对！')+' 共 '+moves+' 步';document.getElementById('ov').classList.add('show');upd()},600)}}
    else{lock=true;setTimeout(()=>{ca.classList.remove('f');cb.classList.remove('f');flipped=[];lock=false},900)}upd()}}
document.getElementById('new').onclick=init;document.getElementById('again').onclick=init;init();
</script></body></html>
