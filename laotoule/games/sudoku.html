<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>数独 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
#turn{font-size:1.2rem;font-weight:800;text-align:center;margin:2px 0 6px}
#grid{display:grid;width:min(96vw,calc(100vh - var(--ltl-chrome, 0px) - 300px),520px);margin:0 auto;background:#222;border:3px solid #222;gap:1px;touch-action:manipulation}
.cell{aspect-ratio:1;border:0;background:#fff;font-weight:800;font-size:clamp(1.05rem,5.2vw,1.7rem);padding:0;color:#1971c2;position:relative;font-family:inherit;-webkit-user-select:none;user-select:none}
.cell.fix{color:#1a1a1a;background:#fff8ee}
.cell.sel{background:#ffd43b;color:#222;box-shadow:inset 0 0 0 3px #222;z-index:1}
.cell.same{background:#fff8e1}
.cell.fix.same{background:#fff3c4}
.cell.bad{background:#ffc9c9;color:#c92a2a}
.cell.sel.bad{background:#ffb3b3}
.cell.bR{border-right:3px solid #222}
.cell.bB{border-bottom:3px solid #222}
.notes{display:grid;position:absolute;inset:1px;font-weight:700;color:#1c4e89;line-height:1;pointer-events:none}
.notes i{font-style:normal}
.numpad{display:grid;gap:8px;width:min(96vw,520px);margin:10px auto}
.numpad .btn{min-height:58px;font-size:1.45rem;padding:0}
.lv .btn.on,.sizes .btn.on,.sw.on{background:#e8590c;color:#fff}
.sizes,.levels{flex-wrap:nowrap}
.sizes .btn,.levels .btn{flex:1 1 0;min-width:0;padding:6px 2px}
#lvsmall{display:none}
body.small #lv9{display:none}
body.small #lvsmall{display:flex}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>🔢 数独</h1></div>
<div class="wrap">
<div class="stats"><div class="stat"><span>用时</span><b id="time">0:00</b></div><div class="stat"><span>空格</span><b id="left">0</b></div><div class="stat"><span>最好</span><b id="best">--</b></div></div>
<div id="turn">选一格，再点下面的数字</div>
<div id="grid"></div>
<div class="numpad" id="pad"></div>
<div class="controls sizes"><button class="btn" data-size="4" type="button">4格</button><button class="btn" data-size="6" type="button">6格</button><button class="btn on" data-size="9" type="button">9格</button></div>
<div class="controls lv" id="lv9"><button class="btn" data-diff="easy" type="button">😊 简单</button><button class="btn" data-diff="medium" type="button">🤔 中等</button><button class="btn" data-diff="hard" type="button">😤 困难</button><button class="btn" data-diff="expert" type="button">🧠 专家</button></div>
<div class="controls levels" id="lvsmall"></div>
<div class="controls"><button class="btn" id="pencil" type="button">✏️ 铅笔：关</button><button class="btn" id="err" type="button">🚦 错误高亮：开</button><button class="btn" id="same" type="button">同数字：关</button><button class="btn" id="undo" type="button">↩️ 撤销</button><button class="btn blue" id="hint" type="button">💡 提示</button><button class="btn green" id="new" type="button">🔄 新题</button></div>
<div class="help"><h2>📖 怎么玩</h2><ul>
<li><b>9 格</b>：每行、每列、每个粗线九宫都是 1 到 9。<b>6 格</b>：每个 2 行 3 列的宫是 1 到 6。<b>4 格</b>：每个田字格是 1 到 4。4 格和 6 格各有 10 关，可以重玩。</li>
<li>点一下只选中这一格。同数字的浅色提示默认关掉，需要时再打开「同数字」。</li>
<li>先点格子，再点大数字。铅笔用来记可能的数。错误高亮打开时，重复的数字会变红。</li>
</ul></div>
</div>
<script src="sudoku.engine.js"></script>
<script src="../common.js"></script>
<script>
const LVN={easy:'简单',medium:'中等',hard:'困难',expert:'专家'};
let size=9,level='easy',stage=0,puzzle,solution,user,notes,given,sel,hist,showErr,sameOn,pencil,base,t0,running,timer,won;
const grid=document.getElementById('grid'),pad=document.getElementById('pad');
const sp=()=>SUDOKU.specOf(size);
function digits(){return sp().n}
function cells(){return size*size}
function bestKey(){return size===9?'laotoule:sdBest':'laotoule:sdBest'+size}
function stateKey(){return size===9?'laotoule:sdState':'laotoule:sdState'+size}
function bestMap(){try{return JSON.parse(localStorage.getItem(bestKey())||'{}')}catch(e){return {}}}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}
function elapsed(){return base+(running?Date.now()-t0:0)}
function paintTime(){document.getElementById('time').textContent=fmt(elapsed())}
function startClock(){if(running||won)return;running=true;t0=Date.now();timer=setInterval(paintTime,250)}
function stopClock(){if(running){base=elapsed();running=false;clearInterval(timer)}paintTime()}
function bestId(){return size===9?level:String(stage)}
function save(){
  localStorage.setItem(stateKey(),JSON.stringify({size,level,stage,puzzle,solution,user,notes,sel,showErr,sameOn,pencil,base:elapsed(),won}));
  localStorage.setItem('laotoule:sdSize',String(size));
  const b=bestMap()[bestId()];
  document.getElementById('best').textContent=b?fmt(b*1000):'--';
}
function leftCount(){let n=0;for(let i=0;i<cells();i++)if(!user[i])n++;document.getElementById('left').textContent=n;return n}
function noteLayout(){return size===4?[2,2]:size===6?[3,2]:[3,3]}
function paint(){
  const {n,br,bc}=sp();
  const bad=showErr?SUDOKU.conflicts(user,n,br,bc):[];
  const d=sameOn&&sel>=0?user[sel]:0;
  const [nc,nr]=noteLayout();
  [...grid.children].forEach((el,i)=>{
    el.className='cell'+(given[i]?' fix':'')+(i===sel?' sel':'')+(d&&user[i]===d&&i!==sel?' same':'')+(bad[i]?' bad':'');
    if((i%n)%bc===bc-1&&i%n!==n-1)el.classList.add('bR');
    if(Math.floor(i/n)%br===br-1&&i<n*(n-1))el.classList.add('bB');
    el.innerHTML='';
    if(user[i])el.textContent=user[i];
    else if(notes[i]){
      const box=document.createElement('span');box.className='notes';
      box.style.gridTemplateColumns='repeat('+nc+',1fr)';
      box.style.fontSize=size===9?'clamp(.55rem,2.1vw,.72rem)':size===6?'clamp(.62rem,2.4vw,.85rem)':'clamp(.7rem,3vw,1rem)';
      for(let k=1;k<=n;k++){const s=document.createElement('i');s.textContent=(notes[i]&(1<<k))?k:'';box.appendChild(s)}
      el.appendChild(box);
    }
  });
  document.getElementById('pencil').textContent='✏️ 铅笔：'+(pencil?'开':'关');
  document.getElementById('pencil').classList.toggle('on',pencil);
  document.getElementById('err').textContent='🚦 错误高亮：'+(showErr?'开':'关');
  document.getElementById('err').classList.toggle('on',showErr);
  document.getElementById('same').textContent='同数字：'+(sameOn?'开':'关');
  document.getElementById('same').classList.toggle('on',sameOn);
  document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('on',Number(b.dataset.size)===size));
  document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('on',size===9&&b.dataset.diff===level));
  document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('on',size!==9&&Number(b.dataset.stage)===stage));
  document.body.classList.toggle('small',size!==9);
  leftCount();
}
function checkWin(){
  if(user.some((v,i)=>v!==solution[i]))return;
  if(won)return;
  won=true;stopClock();save();
  const sec=Math.round(elapsed()/1000);
  const map=bestMap();
  const id=bestId();
  if(!map[id]||sec<map[id]){
    map[id]=sec;localStorage.setItem(bestKey(),JSON.stringify(map));
    if(size===9&&level==='easy')localStorage.setItem('laotoule:sdEasy',String(sec));
  }
  document.getElementById('best').textContent=fmt(map[id]*1000);
  document.getElementById('turn').textContent='🎉 做对了！用时 '+fmt(elapsed());
  LTL.toast('数独完成');
  [523,659,784,1046].forEach((f,k)=>setTimeout(()=>LTL.beep(f,.1,'triangle'),k*100));
}
function put(i,digit,isPencil){
  if(given[i]||won){LTL.toast('这格是题目给的');return}
  const {n,br,bc}=sp();
  hist.push({i,u:user[i],n:notes[i]});
  if(hist.length>200)hist.shift();
  if(isPencil){
    if(user[i])user[i]=0;
    notes[i]^=(1<<digit);
  }else{
    user[i]=user[i]===digit?0:digit;
    notes[i]=0;
    if(user[i])notes.forEach((m,k)=>{if(m&&SUDOKU.peers(i,n,br,bc).has(k))notes[k]&=~(1<<digit)});
  }
  LTL.beep(520,.04,'square',.04);
  startClock();paint();save();
  if(!isPencil)checkWin();
  if(!won)document.getElementById('turn').textContent=pencil?'铅笔模式：再点一次可擦掉':'只选中了这一格';
}
function erase(){
  if(sel<0||given[sel]||won)return;
  hist.push({i:sel,u:user[sel],n:notes[sel]});
  user[sel]=0;notes[sel]=0;paint();save();
}
function buildBoard(){
  const n=digits();
  grid.style.gridTemplateColumns='repeat('+n+',1fr)';
  grid.innerHTML='';
  for(let i=0;i<n*n;i++){
    const b=document.createElement('button');b.type='button';b.className='cell';
    b.onclick=()=>{sel=i;paint()};
    grid.appendChild(b);
  }
  pad.innerHTML='';
  const cols=n<=4?4:n<=6?4:5;
  pad.style.gridTemplateColumns='repeat('+cols+',1fr)';
  for(let d=1;d<=n;d++){
    const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=d;
    b.onclick=()=>{if(sel<0){LTL.toast('先点一个格子');return}put(sel,d,pencil)};
    pad.appendChild(b);
  }
  const er=document.createElement('button');er.type='button';er.className='btn red';er.textContent='擦除';er.onclick=erase;pad.appendChild(er);
}
function title(){
  if(size===9)return LVN[level]+' · 9格';
  return (size===4?'4格':'6格')+' · 第 '+(stage+1)+' 关';
}
function newGame(opts){
  if(opts&&opts.size)size=opts.size;
  if(opts&&opts.level)level=opts.level;
  if(opts&&opts.stage!=null)stage=opts.stage;
  let p;
  if(size===9)p=SUDOKU.makePuzzle(level);
  else p=SUDOKU.level(size,stage);
  puzzle=p.puzzle;solution=p.solution;user=puzzle.slice();
  given=puzzle.map(Boolean);notes=Array(cells()).fill(0);hist=[];sel=-1;won=false;
  stopClock();running=false;base=0;
  buildBoard();
  document.getElementById('turn').textContent=title()+' · 选一格';
  paint();save();
}
function boot(){
  showErr=localStorage.getItem('laotoule:sdErr')!=='0';
  sameOn=localStorage.getItem('laotoule:sdSame')==='1';
  pencil=localStorage.getItem('laotoule:sdPencil')==='1';
  size=Number(localStorage.getItem('laotoule:sdSize')||9);
  if(size!==4&&size!==6&&size!==9)size=9;
  const box=document.getElementById('lvsmall');
  if(!box.childElementCount){
    for(let i=0;i<10;i++){
      const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.stage=i;b.textContent=String(i+1);
      b.onclick=()=>newGame({stage:i});
      box.appendChild(b);
    }
  }
  try{
    const s=JSON.parse(localStorage.getItem(stateKey())||'null');
    if(!s||!s.puzzle||s.puzzle.length!==size*size)throw 0;
    level=s.level||'easy';stage=s.stage||0;puzzle=s.puzzle;solution=s.solution;user=s.user;notes=s.notes;given=puzzle.map(Boolean);
    sel=typeof s.sel==='number'?s.sel:-1;won=!!s.won;base=s.base||0;
    if(typeof s.showErr==='boolean')showErr=s.showErr;
    if(typeof s.sameOn==='boolean')sameOn=s.sameOn;
    pencil=!!s.pencil;hist=[];
    buildBoard();
    if(!won)startClock(); else paintTime();
    document.getElementById('turn').textContent=won?'这题已经做完了':'继续上一题';
    paint();save();
  }catch(e){newGame(size===9?{level:'easy'}:{stage:0})}
}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{
  const next=Number(b.dataset.size);
  if(next===size)return;
  save();
  size=next;stage=0;level='easy';
  localStorage.setItem('laotoule:sdSize',String(size));
  boot();
});
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>newGame({size:9,level:b.dataset.diff}));
document.getElementById('pencil').onclick=()=>{pencil=!pencil;localStorage.setItem('laotoule:sdPencil',pencil?'1':'0');paint();save()};
document.getElementById('err').onclick=()=>{showErr=!showErr;localStorage.setItem('laotoule:sdErr',showErr?'1':'0');paint();save()};
document.getElementById('same').onclick=()=>{sameOn=!sameOn;localStorage.setItem('laotoule:sdSame',sameOn?'1':'0');paint();save()};
document.getElementById('undo').onclick=()=>{
  const h=hist.pop();if(!h){LTL.toast('没有可撤销的');return}
  user[h.i]=h.u;notes[h.i]=h.n;sel=h.i;if(won){won=false;startClock()}paint();save();
};
document.getElementById('hint').onclick=()=>{
  if(won)return;
  const cand=[];
  for(let i=0;i<cells();i++)if(user[i]!==solution[i])cand.push(i);
  if(!cand.length)return;
  const i=cand[(Math.random()*cand.length)|0];
  hist.push({i,u:user[i],n:notes[i]});
  user[i]=solution[i];notes[i]=0;sel=i;startClock();paint();save();checkWin();
};
document.getElementById('new').onclick=()=>newGame(size===9?{level}:{stage});
addEventListener('keydown',e=>{
  const n=digits();
  if(e.key>='1'&&e.key<=String(n)){if(sel>=0)put(sel,Number(e.key),pencil||e.shiftKey)}
  else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}
  else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const r=sel<0?0:(sel/n)|0,c=sel<0?0:sel%n;
    const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    sel=(r+d[0]+n)%n*n+(c+d[1]+n)%n;paint();
  }
});
boot();
</script></body></html>
