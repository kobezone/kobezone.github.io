<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>推箱子 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
#board{margin:0 auto;display:grid;gap:3px;touch-action:none;justify-content:center;background:#cbb89a;padding:8px;border:3px solid #5c4033;border-radius:16px;box-shadow:0 6px 0 #3e2a22,inset 0 0 0 2px #efe2cf}
.t{width:var(--ltl-tile);height:var(--ltl-tile);border-radius:6px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.t svg{width:100%;height:100%;display:block}
#levels{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
#levels button{min-width:44px;min-height:44px;padding:4px 8px}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>📦 推箱子</h1></div>
<div class="wrap">
<div class="stats">
  <div class="stat"><span>关卡</span><b id="lv">1</b></div>
  <div class="stat"><span>步数</span><b id="moves">0</b></div>
  <div class="stat"><span>已过</span><b id="cleared">0</b></div>
  <div class="stat"><span>最高关</span><b id="best">0</b></div>
</div>
<div id="board"></div>
<div class="dpad">
  <span></span><button class="btn blue" data-d="0,-1" type="button">⬆</button><span></span>
  <button class="btn blue" data-d="-1,0" type="button">⬅</button><button class="btn blue" data-d="0,1" type="button">⬇</button><button class="btn blue" data-d="1,0" type="button">➡</button>
</div>
<div class="controls">
  <button class="btn" id="undo" type="button">↩️ 悔一步</button>
  <button class="btn" id="restart" type="button">🔄 重开本关</button>
</div>
<div id="levels"></div>
<div class="help"><h2>📖 怎么玩</h2><ul>
<li>把木箱推进地上的红黄圈。箱子到位后还是木箱，角上会出现绿勾。</li>
<li>棕色砖墙不能穿。蓝衣服的小人就是你。大箭头、方向键，或在棋盘上<b>滑动</b>。</li>
<li>推错了可以悔一步，也可以重开这一关。一共 20 关，都是新设计的小图。</li>
</ul></div>
<div class="overlay" id="ov"><div id="ovt">过关了</div><button class="btn" id="next">下一关</button></div>
</div>
<script src="../common.js"></script>
<script>
const LEVELS=[
['#####','#@$.#','#####'],
['#####','# . #','# $ #','# @ #','#####'],
['######','#@ $.#','######'],
['######','#.$@ #','######'],
['#####','#@#.#','# $ #','#   #','#####'],
['#####','#@  #','# $$ #','# .. #','#####'],
['######','#.@$ #','#    #','######'],
['######','#@   #','# #$ #','# #. #','######'],
['#######','#@  . #','# $$  #','#  .  #','#######'],
['#######','#@.#  #','# $ $ #','#  .  #','#######'],
['########','#@$.   #','#      #','#@$ .  #','########'],
['#######','#@ $ .#','#  $ .#','#######'],
['######','#@   #','# $$ #','# .. #','######'],
['#######','#@    #','# $ $ #','# . . #','#######'],
['#######','#@ .  #','# $#$ #','#  .  #','#######'],
['#####','# @ #','# $ #','# . #','#####'],
['######','#@   #','# $$ #','# . .#','######'],
['######','#@   #','# $.#','# $.#','######'],
['#######','#  .  #','#  $  #','#  @  #','#######'],
['######','#.   #','#$   #','# @  #','######']
];
let li=0,walls,goals,boxes,px,py,hist,moves,cleared;
const board=document.getElementById('board');
function key(x,y){return x+','+y}
function load(i,keepHist){
  li=i; walls=new Set(); goals=new Set(); boxes=new Set();
  let W=0,H=LEVELS[i].length;
  LEVELS[i].forEach((row,y)=>{W=Math.max(W,row.length); [...row].forEach((ch,x)=>{
    if(ch==='#') walls.add(key(x,y));
    if(ch==='.'||ch==='*'||ch==='+') goals.add(key(x,y));
    if(ch==='$'||ch==='*') boxes.add(key(x,y));
    if(ch==='@'||ch==='+'){px=x;py=y}
  })});
  hist=[]; moves=0;
  document.getElementById('lv').textContent=(i+1)+' / 20';
  document.getElementById('moves').textContent=0;
  document.getElementById('ov').classList.remove('show');
  board.style.gridTemplateColumns=`repeat(${W},var(--ltl-tile))`;
  render();
}
function won(){for(const g of goals) if(!boxes.has(g)) return false; return goals.size>0}
function snapshot(){return {px,py,boxes:[...boxes],moves}}
function move(dx,dy){
  if(document.getElementById('ov').classList.contains('show')) return;
  const nx=px+dx,ny=py+dy,nk=key(nx,ny);
  if(walls.has(nk)) return;
  hist.push(snapshot());
  if(boxes.has(nk)){
    const x2=nx+dx,y2=ny+dy,k2=key(x2,y2);
    if(walls.has(k2)||boxes.has(k2)){hist.pop(); return}
    boxes.delete(nk); boxes.add(k2);
  }
  px=nx; py=ny; moves++;
  document.getElementById('moves').textContent=moves;
  render();
  if(won()){
    cleared=Math.max(cleared,li+1);
    document.getElementById('cleared').textContent=cleared;
    if(LTL.record('sokoban',cleared)) document.getElementById('best').textContent=cleared;
    localStorage.setItem('laotoule:sokobanClear',String(cleared));
    document.getElementById('ovt').textContent=li>=19?'20 关都推完了！':'过关了';
    document.getElementById('next').textContent=li>=19?'从第一关再来':'下一关';
    document.getElementById('ov').classList.add('show');
    LTL.beep(520,.1,'triangle',.05);
  }
}
function undo(){
  const s=hist.pop(); if(!s){LTL.toast('没有可以悔的步了'); return}
  px=s.px; py=s.py; boxes=new Set(s.boxes); moves=s.moves;
  document.getElementById('moves').textContent=moves;
  document.getElementById('ov').classList.remove('show');
  render();
}
const ART={
wall:'<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#5d4037"/><g fill="#8d6e63" stroke="#3e2723" stroke-width="1.2"><rect x="2" y="2" width="28" height="13" rx="1"/><rect x="34" y="2" width="28" height="13" rx="1"/><rect x="2" y="18" width="16" height="13" rx="1"/><rect x="22" y="18" width="20" height="13" rx="1"/><rect x="46" y="18" width="16" height="13" rx="1"/><rect x="2" y="34" width="28" height="13" rx="1"/><rect x="34" y="34" width="28" height="13" rx="1"/><rect x="2" y="50" width="16" height="12" rx="1"/><rect x="22" y="50" width="20" height="12" rx="1"/><rect x="46" y="50" width="16" height="12" rx="1"/></g><rect x="3" y="3" width="26" height="3" fill="rgba(255,255,255,.28)"/></svg>',
floor:'<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#f3e6d0"/><path d="M0 32H64M32 0V64" stroke="#e4d3b8" stroke-width="2"/><circle cx="14" cy="14" r="1.3" fill="#d2c0a4"/><circle cx="46" cy="22" r="1.1" fill="#d2c0a4"/><circle cx="22" cy="48" r="1.2" fill="#d2c0a4"/><circle cx="50" cy="46" r="1.3" fill="#cbb89a"/></svg>',
goal:'<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#f3e6d0"/><circle cx="32" cy="32" r="20" fill="#fff4e0" stroke="#e8590c" stroke-width="4"/><circle cx="32" cy="32" r="11" fill="none" stroke="#ffd43b" stroke-width="4"/><circle cx="32" cy="32" r="3.4" fill="#e8590c"/></svg>',
box:'<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="58" rx="18" ry="3.2" fill="rgba(0,0,0,.25)"/><rect x="9" y="16" width="46" height="40" rx="3" fill="#7a4e24"/><rect x="11" y="12" width="42" height="38" rx="3" fill="#d0893e" stroke="#5c3a1a" stroke-width="2"/><path d="M11 24H53M11 35H53M32 12V50" stroke="#a56b2e" stroke-width="2"/><rect x="11" y="12" width="42" height="6" fill="rgba(255,255,255,.28)"/><path d="M13 14h7v6h-7zM44 14h7v6h-7zM13 40h7v6h-7zM44 40h7v6h-7z" fill="#e9ecef" stroke="#495057" stroke-width="1"/></svg>',
boxon:'<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="24" fill="none" stroke="#2f9e44" stroke-width="3"/><rect x="9" y="16" width="46" height="40" rx="3" fill="#7a4e24"/><rect x="11" y="12" width="42" height="38" rx="3" fill="#d0893e" stroke="#2b8a3e" stroke-width="2.4"/><path d="M11 24H53M11 35H53M32 12V50" stroke="#a56b2e" stroke-width="2"/><rect x="11" y="12" width="42" height="6" fill="rgba(255,255,255,.28)"/><path d="M13 14h7v6h-7zM44 14h7v6h-7zM13 40h7v6h-7zM44 40h7v6h-7z" fill="#e9ecef" stroke="#495057" stroke-width="1"/><circle cx="50" cy="14" r="8" fill="#2f9e44" stroke="#fff" stroke-width="1.5"/><path d="M46 14l2.4 2.6L54 11.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
me:'<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="58" rx="14" ry="3.4" fill="rgba(0,0,0,.28)"/><path d="M22 34h20v14h-6v8h-8v-8h-6z" fill="#1c7ed6" stroke="#0b3d66" stroke-width="1.4"/><rect x="14" y="34" width="7" height="14" rx="2" fill="#ffd8a8" stroke="#222" stroke-width="1"/><rect x="43" y="34" width="7" height="14" rx="2" fill="#ffd8a8" stroke="#222" stroke-width="1"/><circle cx="32" cy="22" r="12" fill="#ffd8a8" stroke="#222" stroke-width="1.4"/><path d="M20 20q12-16 24 0v3q-12-10-24 0z" fill="#5c4033"/><circle cx="27" cy="23" r="1.7" fill="#222"/><circle cx="37" cy="23" r="1.7" fill="#222"/><path d="M28 28q4 3 8 0" fill="none" stroke="#c2255c" stroke-width="1.4" stroke-linecap="round"/></svg>'
};
const ART_LABEL={wall:'墙',floor:'地面',goal:'目标',box:'箱子',boxon:'箱子已到位',me:'你'};
function render(){
  board.innerHTML='';
  const H=LEVELS[li].length, W=Math.max(...LEVELS[li].map(r=>r.length));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=key(x,y), d=document.createElement('div');
    let cls='floor';
    if(walls.has(k)) cls='wall';
    else if(x===px&&y===py) cls='me';
    else if(boxes.has(k)&&goals.has(k)) cls='boxon';
    else if(boxes.has(k)) cls='box';
    else if(goals.has(k)) cls='goal';
    d.className='t '+cls;
    d.innerHTML=ART[cls];
    d.setAttribute('role','img');
    d.setAttribute('aria-label',ART_LABEL[cls]);
    board.appendChild(d);
  }
}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.d.split(',').map(Number); move(dx,dy)});
addEventListener('keydown',e=>{
  const km={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(km[e.key]){e.preventDefault(); move(...km[e.key])}
  if(e.key==='z'||e.key==='Z'||e.key==='Backspace') undo();
});
LTL.onSwipe(board,(dir)=>{const m={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}; move(...m[dir])});
document.getElementById('undo').onclick=undo;
document.getElementById('restart').onclick=()=>load(li);
document.getElementById('next').onclick=()=>{ if(li>=19) load(0); else load(li+1) };
const levelsEl=document.getElementById('levels');
LEVELS.forEach((_,i)=>{const b=document.createElement('button'); b.className='btn'; b.textContent=i+1; b.onclick=()=>load(i); levelsEl.appendChild(b)});
cleared=+localStorage.getItem('laotoule:sokobanClear')||0;
document.getElementById('cleared').textContent=cleared;
document.getElementById('best').textContent=LTL.getBest('sokoban')||cleared;
load(0);
window.__TEST={
  move:(dx,dy)=>move(dx,dy),
  undo, load,
  state:()=>({px,py,boxes:[...boxes],moves,won:won(),li})
};
</script></body></html>
