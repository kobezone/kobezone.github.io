<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>医院小医生 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:480px;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.hud.stats{display:block;margin:0 0 4px;min-width:0;border:0;box-shadow:none;background:transparent;padding:0;text-align:center;font-size:1.2rem;font-weight:900}
.hud b{color:#d6336c}
.clinic{position:relative;flex:1;min-height:230px;border:4px solid #222;border-radius:18px;overflow:hidden;background:linear-gradient(#ffd6e8 0 10%,#fff0f6 10% 56%,#d8f5dc 56% 70%,#f6d7a8 70%);touch-action:manipulation}
.door{position:absolute;right:8px;top:8px;width:54px;height:78px;background:#ff9db5;border:3px solid #222;border-radius:8px 8px 0 0;z-index:1}
.door span{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#fff;font-size:.85rem;font-weight:900}
.door i{position:absolute;right:8px;top:36px;width:8px;height:8px;border-radius:50%;background:#ffd43b;border:2px solid #222}
.rug{position:absolute;left:30%;bottom:6px;width:42%;height:14px;background:#ffc9de;border:3px solid #222;border-radius:10px;z-index:1}
.bed,.chair,.cabinet,.doctor,.patient{position:absolute;z-index:2}
.bed{left:6px;bottom:8px;width:48%;height:34%}
.bed svg,.chair svg,.cabinet svg,.doctor svg,.patient .who{width:100%;height:100%;display:block}
.chair{left:46%;bottom:10px;width:15%;height:22%}
.cabinet{right:6px;bottom:16%;width:22%;height:42%;z-index:1}
.doctor{left:6px;bottom:10px;width:92px;height:136px;z-index:3;transition:left .65s ease,transform .35s ease}
.doctor svg{overflow:visible}
.doctor.walk .doc-svg{animation:docbob .22s ease-in-out infinite}
.doctor.to-patient{left:10%}
.doctor.aside{left:52%}
.doctor.using{transform:rotate(-5deg);transform-origin:50% 100%}
.doctor .arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .35s ease}
.doctor.using .arm{transform:rotate(-48deg)}
.doctor.using .tubes{opacity:0}
@keyframes docbob{50%{transform:translateY(-6px)}}
.patient{left:108%;bottom:12px;width:96px;height:164px;z-index:4;transition:left .9s cubic-bezier(.22,.7,.2,1),bottom .9s cubic-bezier(.22,.7,.2,1),width .4s ease,height .4s ease,opacity .35s}
.patient.to-chair{left:44%}
.patient.to-bed{left:8%;bottom:12px}
.patient.bedtime{transition:left .55s cubic-bezier(.22,.7,.2,1),bottom .55s cubic-bezier(.22,.7,.2,1),width .55s ease,height .55s ease,opacity .35s}
.patient.bedtime.sit{left:13%;bottom:8%;width:32%;height:27%}
.patient.bedtime.lie{left:2%;bottom:10%;width:46%;height:18%}
.patient.bye{left:8%;bottom:12px}
.patient.bye .who{animation:sway .7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
.patient .who{position:absolute;left:0;right:0;bottom:0;height:78%;transform-origin:50% 100%;transition:transform .24s ease}
.patient.walking .who{animation:pbob .26s ease-in-out infinite}
@keyframes pbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.patient .shadow{position:absolute;left:16%;right:16%;bottom:2px;height:8px;background:rgba(80,40,50,.16);border-radius:50%;z-index:0}
.patient.walking .shadow{animation:shad .26s ease-in-out infinite}
@keyframes shad{50%{transform:scaleX(.65);opacity:.45}}
.patient .fig{overflow:visible;display:block}
.patient .fig.front{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%}
.patient .arm,.patient .leg{transform-box:fill-box;transform-origin:50% 0%;transition:transform .35s ease}
.patient.walking .arm-l{animation:swingL .26s ease-in-out infinite}
.patient.walking .arm-r{animation:swingR .26s ease-in-out infinite}
.patient.walking .leg-l{animation:stepL .26s ease-in-out infinite}
.patient.walking .leg-r{animation:stepR .26s ease-in-out infinite}
@keyframes swingL{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-22deg)}}
@keyframes swingR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(26deg)}}
@keyframes stepL{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes stepR{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
.patient.auscult .arm-l{transform:rotate(18deg)}
.patient.auscult .arm-r{transform:rotate(-16deg)}
.patient.bye .arm-r{animation:wave .7s ease-in-out infinite;transform-origin:50% 0%}
@keyframes wave{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(-72deg)}}
.patient.turn .who{transform:scaleX(.32)}
.patient.snapsize{transition:none}
.patient.sit .who,.patient.lie .who{height:100%}
.patient.sit .shadow,.patient.lie .shadow,.patient.turn .shadow{opacity:0}
.patient .pose-sit,.patient .pose-lie{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.patient.sit .pose-lie{opacity:0;transform:rotate(12deg);transform-origin:30% 62%;transition:opacity .18s ease,transform .48s cubic-bezier(.22,.7,.2,1)}
.patient.lie .pose-sit{opacity:0;transform:rotate(-24deg) translateY(6px);transform-origin:50% 82%;transition:opacity .16s ease,transform .36s ease}
.patient.lie .pose-lie{opacity:1;transform:none;transition:opacity .4s ease .08s,transform .48s cubic-bezier(.22,.7,.2,1)}
.patient .eye-shut{display:none}
.patient.tucked .eye-open{display:none}
.patient.tucked .eye-shut{display:block}
.patient .cover{opacity:0;transform:translateX(28px);transition:opacity .4s ease,transform .48s ease}
.patient.tucked .cover{opacity:1;transform:none}
.blanket,.zzz{display:none}
.patient.sit .bubble,.patient.lie .bubble{top:auto;bottom:calc(100% + 4px)}
.patient.sit .bubble{left:50%;transform:translateX(-50%)}
.patient.lie .bubble{left:0;transform:none}
.patient.tucked .zzz{display:flex;gap:1px;position:absolute;left:38%;top:auto;bottom:calc(100% + 6px);z-index:4;font-weight:900;color:#9c36b5;line-height:1;background:#fff;border:3px solid #222;border-radius:12px;padding:1px 5px}
.patient.tucked .zzz span{display:inline-block;animation:zzz 1s ease-in-out infinite}
.patient.tucked .zzz span:nth-child(2){animation-delay:.15s;font-size:1.25rem}
.patient.tucked .zzz span:nth-child(3){animation-delay:.3s;font-size:1.45rem}
@keyframes zzz{0%{opacity:.25;transform:translateY(4px)}100%{opacity:1;transform:translateY(-10px)}}
.bubble{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border:3px solid #222;border-radius:16px;padding:2px 8px;font-weight:900;font-size:1.12rem;white-space:nowrap;box-shadow:0 3px 0 #222;z-index:5}
.bubble svg{width:30px;height:30px;vertical-align:-8px}
.bubble.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(.45)}70%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
.queue{position:absolute;left:8px;top:8px;background:#fff;border:3px solid #222;border-radius:12px;padding:1px 8px;font-weight:900;font-size:.95rem;z-index:5}
.window{position:absolute;left:46%;top:12px;width:62px;height:48px;background:#d0ebff;border:3px solid #222;border-radius:8px;z-index:1}
.window i{position:absolute;background:#222}
.window i:first-child{left:50%;top:0;bottom:0;width:3px;margin-left:-1px}
.window i:nth-child(2){top:50%;left:0;right:0;height:3px;margin-top:-1px}
.window span{position:absolute;left:0;right:0;top:11px;text-align:center;font-size:.95rem}
.cord,.scope{position:absolute;pointer-events:none;opacity:0;transition:opacity .2s linear}
.cord{z-index:3;height:5px;margin-top:-3px;background:#74c0fc;border-radius:6px;transform-origin:0 50%;box-shadow:0 0 0 2px #222}
.scope{z-index:7;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#74c0fc 55%,#1c7ed6);border:3px solid #222}
.scope::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid #ff8fab;opacity:0}
.clinic.listening .cord,.clinic.listening .scope{opacity:1}
.clinic.listening .scope.pulse{animation:thump .56s ease-in-out infinite}
.clinic.listening .scope.pulse::after{animation:ring .7s ease-out infinite}
@keyframes thump{0%,100%{transform:scale(1)}28%{transform:scale(1.22)}46%{transform:scale(1)}62%{transform:scale(1.12)}}
@keyframes ring{0%{opacity:.85;transform:scale(.55)}100%{opacity:0;transform:scale(2.3)}}
.heart{position:absolute;z-index:8;font-size:1.25rem;pointer-events:none;animation:floatup .95s ease-out forwards}
.praise{--dx:-50%;position:absolute;left:50%;top:16%;z-index:8;transform:translateX(-50%);background:#fff;border:3px solid #222;border-radius:999px;padding:2px 12px;font-weight:900;color:#d6336c;pointer-events:none;animation:floatup 1.15s ease forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(var(--dx,-50%),-64px);opacity:0}}
.hint{text-align:center;font-size:1.05rem;font-weight:800;margin:6px 0 0;color:#7a3e55;min-height:1.3em}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.actions .btn{flex:1 1 30%;max-width:160px;min-height:72px;font-size:1.05rem}
.actions .btn.wide{flex:1 1 100%;max-width:280px;min-height:64px;font-size:1.28rem}
.actions .btn.med{flex-direction:column;gap:1px;padding:6px 6px;line-height:1.15}
.actions .btn.med svg{width:34px;height:34px}
.actions .btn.on{background:#fcc2d7}
.actions .btn:disabled{opacity:.75}
.actions .btn.shake{animation:shake .42s ease}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.rate{margin-top:6px;text-align:center;background:#fff;border:3px solid #222;border-radius:14px;padding:4px 8px;font-weight:900}
.rate[hidden]{display:none !important}
.rate .starline{font-size:1.7rem;letter-spacing:2px;color:#f59f00;line-height:1.1}
.rate .dim{color:#ced4da}
.rate .nexttime{font-size:.95rem;font-weight:800}
.rate .nexttime svg{width:26px;height:26px;vertical-align:-7px}
.wrap .controls{margin:6px 0 0}
.wrap .help{margin:8px 0 0;padding:8px 12px}
#ov{z-index:9}
#ovt{font-size:1.5rem;font-weight:900}
#ovsub{font-size:1.05rem;font-weight:800}
#ovscore{font-size:2.2rem;font-weight:900;color:#e64980}
body .toast{top:max(62px,calc(env(safe-area-inset-top) + 54px));bottom:auto}
@media (prefers-reduced-motion:reduce){
  .patient,.patient .who,.patient .arm,.patient .leg,.patient .pose-sit,.patient .pose-lie,.patient .cover,.doctor,.doctor .arm{transition-duration:.01ms}
  .patient.walking .who,.patient.bye .who,.patient.walking .arm,.patient.walking .leg,.patient.bye .arm-r,.doctor.walk .doc-svg,.patient.walking .shadow,.clinic.listening .scope.pulse,.clinic.listening .scope.pulse::after,.patient.tucked .zzz span,.heart,.praise,.bubble.pop,.actions .btn.shake{animation:none}
}
@media (max-width:360px){
  .doctor{width:80px;height:120px}
  .patient{width:86px;height:150px}
  .actions .btn.med{min-height:68px;font-size:.95rem}
  .actions .btn.med svg{width:28px;height:28px}
}
</style></head><body>

<script>
const MEDS=[
  {id:'fever',name:'退烧药',bg:'#ffc9c9',sym:'fever'},
  {id:'cough',name:'止咳药',bg:'#d0bfff',sym:'cough'},
  {id:'tummy',name:'肚痛药',bg:'#b2f2bb',sym:'tummy'},
  {id:'band',name:'创可贴',bg:'#fff3bf',sym:'cut'},
  {id:'head',name:'止痛药',bg:'#a5d8ff',sym:'head'}
];
const CASES=[
  {sym:'fever',name:'发烧',med:'fever'},
  {sym:'cough',name:'咳嗽',med:'cough'},
  {sym:'tummy',name:'肚子疼',med:'tummy'},
  {sym:'cut',name:'擦伤',med:'band'},
  {sym:'head',name:'头疼',med:'head'}
];
const KINDS=['kid','adult','elder'];
const ICONS={
  fever:'<svg viewBox="0 0 32 32" aria-label="发烧"><rect x="14" y="4" width="6" height="20" rx="3" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="17" cy="26" r="5" fill="#e03131" stroke="#222" stroke-width="2"/><rect x="16" y="14" width="2" height="8" fill="#e03131"/></svg>',
  cough:'<svg viewBox="0 0 32 32" aria-label="咳嗽"><circle cx="14" cy="16" r="8" fill="#fff" stroke="#222" stroke-width="2"/><path d="M22 10 q8 2 4 8 M24 16 q8 2 2 8" fill="none" stroke="#1971c2" stroke-width="2"/></svg>',
  tummy:'<svg viewBox="0 0 32 32" aria-label="肚子疼"><circle cx="16" cy="18" r="10" fill="#ffd8a8" stroke="#222" stroke-width="2"/><path d="M10 18 q6 6 12 0" fill="none" stroke="#e03131" stroke-width="2"/></svg>',
  cut:'<svg viewBox="0 0 32 32" aria-label="擦伤"><rect x="4" y="12" width="24" height="10" rx="3" fill="#fff" stroke="#222" stroke-width="2"/><path d="M16 12 v10 M10 17 h12" stroke="#e03131" stroke-width="2"/></svg>',
  head:'<svg viewBox="0 0 32 32" aria-label="头疼"><circle cx="16" cy="18" r="9" fill="#ffd8a8" stroke="#222" stroke-width="2"/><path d="M16 4 l2 6 h-4 z" fill="#fab005" stroke="#222" stroke-width="2"/></svg>'
};
const HEARTS=['💗','💖','✨','🌸','💕'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=reduce
  ?{walk:240,doc:200,reach:180,hold:320,bed:180,turn:20,sit:40,lie:40,tuck:180}
  :{walk:980,doc:680,reach:420,hold:1180,bed:900,turn:260,sit:700,lie:620,tuck:780};
const SKIN='#ffd8a8';
function palette(kind){
  const kid=kind==='kid', elder=kind==='elder';
  return {
    kid, elder,
    hair:elder?'#dee2e6':kid?'#f59f00':'#343a40',
    shirt:kid?'#ff922b':elder?'#e599f7':'#74c0fc',
    who:kid?'小孩':elder?'老人':'大人',
    scale:kid?0.84:elder?0.96:1
  };
}
function smilePath(mood, cx, cy){
  if(mood==='happy') return `M${cx-8} ${cy+6} q8 8 16 0`;
  if(mood==='calm') return `M${cx-6} ${cy+7} q6 4 12 0`;
  return `M${cx-1} ${cy+8} a2.2 2.2 0 1 1 .1 0`;
}
function hand(cx, cy, tx, ty, r){
  r=r||8;
  const thumb=tx==null?'':`<circle cx="${tx}" cy="${ty}" r="${Math.round(r*0.42*10)/10}" fill="${SKIN}" stroke="#222" stroke-width="2"/>`;
  return `<circle class="hand" cx="${cx}" cy="${cy}" r="${r}" fill="${SKIN}" stroke="#222" stroke-width="3"/>${thumb}`;
}
function headArt(kind, mood, cx, cy, r, sleepable){
  const p=palette(kind);
  const hr=p.kid?r+2:r;
  const bow=p.kid?`<path d="M${cx-hr+4} ${cy-hr+6} q6-8 10 0 q-5 3-10 0 q-6-8-10 0 q5 3 10 0" fill="#ff8fab" stroke="#222" stroke-width="2"/><circle cx="${cx-hr+4}" cy="${cy-hr+6}" r="2.3" fill="#fff" stroke="#222" stroke-width="1.5"/>`:'';
  const glasses=p.elder?`<path d="M${cx-11} ${cy-1} h9 M${cx+2} ${cy-1} h9" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>`:'';
  const open=`<g class="eye-open"><circle cx="${cx-6}" cy="${cy}" r="2.2" fill="#222"/><circle cx="${cx+6}" cy="${cy}" r="2.2" fill="#222"/><circle cx="${cx-11}" cy="${cy+4}" r="2.5" fill="#ff8fab"/><circle cx="${cx+11}" cy="${cy+4}" r="2.5" fill="#ff8fab"/></g>`;
  const shut=`<g class="eye-shut"><path d="M${cx-10} ${cy} q4 3 8 0 M${cx+2} ${cy} q4 3 8 0" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/><circle cx="${cx-11}" cy="${cy+4}" r="2.4" fill="#ff8fab"/><circle cx="${cx+11}" cy="${cy+4}" r="2.4" fill="#ff8fab"/></g>`;
  return `<circle cx="${cx}" cy="${cy}" r="${hr}" fill="${SKIN}" stroke="#222" stroke-width="3"/>${bow}<path d="M${cx-hr+2} ${cy-5} q${hr-2} -${hr} ${hr*2-4} 5" fill="${p.hair}"/>${glasses}${open}${sleepable?shut:''}<path d="${smilePath(mood,cx,cy)}" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>`;
}
function person(kind, mood){
  const p=palette(kind);
  const cane=p.elder?`<path d="M16 78 q-12 12 -2 30" fill="none" stroke="#8d5524" stroke-width="3" stroke-linecap="round"/>`:'';
  return `<svg class="fig front" viewBox="0 0 100 120" aria-label="${p.who}" preserveAspectRatio="xMidYMax meet" style="transform:scale(${p.scale});transform-origin:50% 100%">
    <g class="arm arm-l" style="transform-box:view-box;transform-origin:20px 50px">${cane}<rect x="14" y="50" width="13" height="30" rx="6" fill="${SKIN}" stroke="#222" stroke-width="3"/>${hand(20,82,27,76)}</g>
    <g class="arm arm-r" style="transform-box:view-box;transform-origin:80px 50px"><rect x="73" y="50" width="13" height="30" rx="6" fill="${SKIN}" stroke="#222" stroke-width="3"/>${hand(80,82,73,76)}</g>
    <rect class="leg leg-l" x="36" y="86" width="12" height="26" rx="4" fill="#748ffc" stroke="#222" stroke-width="3"/>
    <rect class="leg leg-r" x="52" y="86" width="12" height="26" rx="4" fill="#748ffc" stroke="#222" stroke-width="3"/>
    <rect class="torso" x="32" y="46" width="36" height="42" rx="6" fill="${p.shirt}" stroke="#222" stroke-width="3"/>
    ${headArt(kind, mood, 50, 28, 15, false)}
  </svg>`;
}
function bedPerson(kind, mood){
  const p=palette(kind);
  const fit=p.kid?0.9:p.elder?0.96:1;
  const sit=`<svg class="fig pose-sit" viewBox="0 0 140 156" aria-label="${p.who}坐下" preserveAspectRatio="xMidYMax meet">
    <g style="transform:scale(${fit});transform-origin:50% 92%">
      <ellipse cx="48" cy="132" rx="16" ry="9" fill="#748ffc" stroke="#222" stroke-width="3"/>
      <ellipse cx="92" cy="132" rx="16" ry="9" fill="#748ffc" stroke="#222" stroke-width="3"/>
      <rect x="34" y="108" width="72" height="22" rx="10" fill="#748ffc" stroke="#222" stroke-width="3"/>
      <g class="arm arm-l"><rect x="18" y="66" width="14" height="38" rx="7" fill="${SKIN}" stroke="#222" stroke-width="3"/>${hand(25,108,34,102)}</g>
      <g class="arm arm-r"><rect x="108" y="66" width="14" height="38" rx="7" fill="${SKIN}" stroke="#222" stroke-width="3"/>${hand(115,108,106,102)}</g>
      <rect class="torso" x="42" y="58" width="56" height="52" rx="12" fill="${p.shirt}" stroke="#222" stroke-width="3"/>
      ${headArt(kind, mood, 70, 34, 18, false)}

  </svg>`;
  const lie=`<svg class="fig pose-lie" viewBox="0 0 250 118" aria-label="${p.who}躺着" preserveAspectRatio="xMidYMax meet">
    <g style="transform:scale(${fit});transform-origin:42% 70%">
      <g class="pillow">
        <rect x="6" y="46" width="78" height="42" rx="16" fill="#ff8fb3" stroke="#222" stroke-width="3"/>
        <rect x="12" y="36" width="70" height="38" rx="14" fill="#ffd0e2" stroke="#222" stroke-width="3"/>
        <path d="M24 48 h46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      </g>
      <rect x="156" y="44" width="70" height="15" rx="7" fill="#748ffc" stroke="#222" stroke-width="3"/>
      <rect x="156" y="62" width="70" height="15" rx="7" fill="#91a7ff" stroke="#222" stroke-width="3"/>
      <ellipse cx="228" cy="51" rx="12" ry="7" fill="#5c7cfa" stroke="#222" stroke-width="3"/>
      <ellipse cx="228" cy="69" rx="12" ry="7" fill="#748ffc" stroke="#222" stroke-width="3"/>
      <rect class="torso" x="78" y="40" width="86" height="40" rx="14" fill="${p.shirt}" stroke="#222" stroke-width="3"/>
      <rect x="84" y="18" width="42" height="16" rx="8" fill="${SKIN}" stroke="#222" stroke-width="3"/>
      ${hand(130,26,130,14,12)}
      <rect x="84" y="78" width="44" height="16" rx="8" fill="${SKIN}" stroke="#222" stroke-width="3"/>
      ${hand(132,86,132,98,12)}
      ${headArt(kind, mood, 52, 54, 20, true)}
      <g class="cover">
        <rect x="150" y="48" width="92" height="42" rx="16" fill="#ffb3c7" stroke="#222" stroke-width="3"/>
        <path d="M162 60 h68" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
        <path d="M166 76 h48" fill="none" stroke="#f783ac" stroke-width="3" stroke-linecap="round"/>
        <path d="M204 66 c0-5 7-5 7 0 c0-5 7-5 7 0 c0 6-7 10-7 12 c0-2-7-6-7-12z" fill="#e64980" stroke="#222" stroke-width="2"/>
      </g>
    </g>
  </svg>`;
  return sit+lie;
}
function shuffle(a){const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0; const t=b[i]; b[i]=b[j]; b[j]=t} return b}
const clinic=document.getElementById('clinic');
const patientEl=document.getElementById('patient'), bubble=document.getElementById('bubble'), who=document.getElementById('who');
const doctorEl=document.getElementById('doctor'), cord=document.getElementById('cord'), scope=document.getElementById('scope');
const actions=document.getElementById('actions'), rate=document.getElementById('rate'), queueEl=document.getElementById('queue');
const numEl=document.getElementById('num'), scoreEl=document.getElementById('score'), hintEl=document.getElementById('hint'), ov=document.getElementById('ov');
let day=[], idx=0, step='enter', score=0, okPick=false, over=false, lastStars=0, pending=0, tries=0, busy=false, queued=null;
let timers=[], scopeRAF=0, lastMissAt=0;
function later(fn,ms){const id=setTimeout(fn,ms); timers.push(id); return id}
function clearTimers(){timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(scopeRAF); scopeRAF=0}
function clearFx(){
  clinic.classList.remove('listening');
  cancelAnimationFrame(scopeRAF); scopeRAF=0;
  scope.classList.remove('pulse');
  clinic.querySelectorAll('.heart,.praise').forEach(n=>n.remove());
}
function cur(){return day[idx]}
function mood(){
  if(step==='leave'||(okPick&&(step==='rest'||step==='tuck'))) return 'happy';
  if(step==='rest'||step==='tuck') return 'calm';
  return 'wait';
}
function hintFor(){
  if(over) return '今天的病人都看过啦';
  if(step==='enter') return queued?'好，等病人站好就听':'病人正从门口走过来';
  if(step==='listen') return '点大按钮，用听诊器听一听';
  if(step==='listening') return '听诊器贴在胸口，听一听心跳';
  if(step==='med') return tries?'再找一次，点一样的小图标':'点下面一样的小图标';
  if(step==='rest') return '点「去休息」，送病人上床';
  if(step==='tuck') return '盖好小被子，睡一会儿';
  return '星星到啦，可以接下一位';
}
function renderPatient(){
  const p=cur(); if(!p) return;
  who.innerHTML=person(p.kind, mood());
  if(step==='enter'||step==='listen'||step==='listening') bubble.textContent='不舒服';
  else if(step==='tuck') bubble.textContent='呼…';
  else if(step==='leave') bubble.textContent=okPick?'👋 舒服啦':'💗 休息好啦';
  else bubble.innerHTML=ICONS[p.sym]+p.name;
  if(step==='med'){bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop')}
  else bubble.classList.remove('pop');
  numEl.textContent=idx+1;
  scoreEl.textContent=score;
  queueEl.textContent='门口还有 '+(day.length-1-idx)+' 位';
  hintEl.textContent=hintFor();
}
function btn(label, attrs, bg, wide){
  return `<button class="btn${wide?' wide':''}" type="button" ${attrs} style="${bg?'background:'+bg:''}">${label}</button>`;
}
function renderActions(){
  rate.hidden=step!=='leave';
  if(step==='enter'||step==='listen') actions.innerHTML=btn('🩺 听诊','data-act="listen"','#ffdeeb','wide');
  else if(step==='listening') actions.innerHTML=btn('正在听…','disabled','#d0ebff','wide');
  else if(step==='med') actions.innerHTML=cur().opts.map(m=>`<button class="btn med" type="button" data-act="med" data-med="${m.id}" style="background:${m.bg}">${ICONS[m.sym]}<span>${m.name}</span></button>`).join('');
  else if(step==='rest') actions.innerHTML=btn('🛏️ 去休息','data-act="rest"','#d3f9d8','wide');
  else if(step==='tuck') actions.innerHTML=btn('盖被子…','disabled','#ffc9de','wide');
  else {
    const full='★★★★★', on=full.slice(0,lastStars), off=full.slice(lastStars);
    const say=lastStars>=5?'一次就对，病人最开心':lastStars===4?'第二次也对，真仔细':'休息一下也会好，你很认真';
    const right=MEDS.find(m=>m.id===cur().med);
    const extra=okPick?'':`<div class="nexttime">下次可以找这个 ${ICONS[cur().sym]}${right.name}</div>`;
    rate.innerHTML=`<div>${say}</div><div class="starline">${on}<span class="dim">${off}</span></div><div>这位 ${lastStars} 星</div>${extra}`;
    actions.innerHTML=btn(idx>=day.length-1?'🌟 看今天的成绩':'👋 下一位','data-act="next"','#fff3bf','wide');
  }
  if(queued){const b=actions.querySelector('[data-act="listen"]'); if(b) b.classList.add('on')}
  renderPatient();
}
function snapPatient(cls){
  patientEl.style.transition='none';
  patientEl.className='patient '+cls;
  void patientEl.offsetWidth;
  patientEl.style.transition='';
}
function floatWord(text){
  const el=document.createElement('div');
  el.className='praise'; el.textContent=text;
  clinic.appendChild(el);
  later(()=>el.remove(),1200);
}
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const h=document.createElement('span');
    h.className='heart'; h.textContent=HEARTS[i%HEARTS.length];
    h.style.left=x+'px'; h.style.top=y+'px';
    h.style.setProperty('--dx',((Math.random()*64-32)|0)+'px');
    clinic.appendChild(h);
    later(()=>h.remove(),1000);
  }
}
function stepSounds(n){for(let i=0;i<n;i++) later(()=>LTL.beep(230,.03,'triangle',.025), i*200)}
function anchor(){
  const pw=patientEl.offsetWidth, ph=patientEl.offsetHeight;
  const px=patientEl.offsetLeft, py=patientEl.offsetTop;
  const dw=doctorEl.offsetWidth, dh=doctorEl.offsetHeight;
  const dx=doctorEl.offsetLeft, dy=doctorEl.offsetTop;
  const kind=cur()&&cur().kind;
  const drop=kind==='kid'?0.70:kind==='elder'?0.66:0.64;
  const chest={x:px+pw*0.5, y:py+ph*drop};
  const torso=who.querySelector('.torso');
  if(torso && !patientEl.classList.contains('lie') && !patientEl.classList.contains('sit')){
    const cr=torso.getBoundingClientRect(), box=clinic.getBoundingClientRect();
    chest.x=cr.left-box.left+cr.width*0.5;
    chest.y=cr.top-box.top+cr.height*0.46;
  }
  return {chest, hand:{x:dx+dw*0.84, y:dy+dh*0.6}};
}
function putScope(x,y){scope.style.left=x+'px'; scope.style.top=y+'px'}
function setCord(a,b){
  cord.style.left=a.x+'px'; cord.style.top=a.y+'px';
  cord.style.width=Math.hypot(b.x-a.x,b.y-a.y)+'px';
  cord.style.transform='rotate('+(Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI)+'deg)';
}
function showScope(){
  clinic.classList.add('listening');
  const a0=anchor();
  const from={x:a0.hand.x,y:a0.hand.y}, to={x:a0.chest.x,y:a0.chest.y};
  const t0=performance.now();
  const loop=now=>{
    if(!clinic.classList.contains('listening')) return;
    const k=Math.min(1,(now-t0)/Math.max(1,T.reach));
    const e=1-Math.pow(1-k,3);
    const x=from.x+(to.x-from.x)*e, y=from.y+(to.y-from.y)*e;
    putScope(x,y); setCord(anchor().hand,{x,y});
    if(k<1) scopeRAF=requestAnimationFrame(loop);
    else {scope.classList.add('pulse'); burst(to.x,to.y,4); holdScope()}
  };
  scopeRAF=requestAnimationFrame(loop);
}
function holdScope(){
  scopeRAF=requestAnimationFrame(()=>{
    if(!clinic.classList.contains('listening')) return;
    const a=anchor();
    putScope(a.chest.x,a.chest.y);
    setCord(a.hand,a.chest);
    holdScope();
  });
}
function heartBeats(n){
  for(let i=0;i<n;i++){
    later(()=>{LTL.beep(330,.1,'sine',.055); const a=anchor(); burst(a.chest.x,a.chest.y,2)}, i*560);
    later(()=>LTL.beep(247,.13,'sine',.045), i*560+150);
  }
}
function enterPatient(){
  clearTimers(); clearFx();
  step='enter'; busy=true; tries=0; okPick=false; pending=0; queued=null; lastMissAt=0;
  doctorEl.className='doctor';
  snapPatient('at-door');
  renderActions();
  later(()=>{
    patientEl.classList.add('walking');
    patientEl.classList.remove('at-door');
    patientEl.classList.add('to-chair');
    stepSounds(4);
  }, 40);
  later(()=>{
    patientEl.classList.remove('walking');
    step='listen'; busy=false;
    const go=queued; queued=null;
    if(go) listen();
    else renderActions();
  }, T.walk);
}
function listen(){
  if(over) return;
  if(step==='enter'){queued='listen'; hintEl.textContent=hintFor(); const b=actions.querySelector('[data-act="listen"]'); if(b) b.classList.add('on'); return}
  if(step!=='listen'||busy) return;
  busy=true; step='listening';
  renderActions();
  doctorEl.classList.add('walk','to-patient');
  stepSounds(3);
  later(()=>{doctorEl.classList.remove('walk'); doctorEl.classList.add('using'); patientEl.classList.add('auscult'); showScope()}, T.doc);
  later(()=>heartBeats(reduce?1:2), T.doc+T.reach);
  later(finishListen, T.doc+T.reach+T.hold);
}
function finishListen(){
  clearFx();
  doctorEl.classList.remove('using','to-patient','walk');
  patientEl.classList.remove('auscult');
  step='med'; busy=false;
  LTL.beep(523,.08,'triangle',.05);
  later(()=>LTL.beep(659,.08,'triangle',.05),90);
  later(()=>LTL.beep(784,.1,'triangle',.05),180);
  floatWord('听到啦');
  renderActions();
}
function pick(id){
  if(busy||step!=='med'||over) return;
  const good=id===cur().med;
  const now=performance.now();
  if(!good && tries<1){
    tries++; lastMissAt=now;
    const b=actions.querySelector(`[data-med="${id}"]`);
    if(b){b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake')}
    LTL.beep(494,.08,'sine',.04);
    later(()=>LTL.beep(587,.1,'sine',.04),110);
    hintEl.textContent=hintFor();
    floatWord('再试试');
    return;
  }
  if(!good && now-lastMissAt<450) return;
  okPick=good;
  pending=good?(tries?4:5):3;
  step='rest';
  if(good){
    LTL.beep(659,.08,'triangle',.05);
    later(()=>LTL.beep(880,.09,'triangle',.05),100);
    later(()=>LTL.beep(1175,.12,'triangle',.045),200);
    const a=anchor(); burst(a.chest.x,a.chest.y,6);
    floatWord(tries?'也对啦':'真棒');
  }else{
    LTL.beep(523,.1,'sine',.04);
    later(()=>LTL.beep(659,.12,'sine',.04),140);
    floatWord('抱抱');
  }
  renderActions();
}
function rest(){
  if(busy||step!=='rest'||over) return;
  busy=true; step='tuck';
  renderActions();
  doctorEl.classList.remove('to-patient','using','walk');
  doctorEl.classList.add('walk','aside');
  patientEl.classList.remove('to-chair','auscult');
  patientEl.classList.add('walking','to-bed');
  bubble.textContent='去床上';
  hintEl.textContent='走到床边';
  stepSounds(4);
  later(()=>{
    patientEl.classList.remove('walking');
    doctorEl.classList.remove('walk');
    patientEl.classList.add('turn');
    bubble.textContent='转身';
    hintEl.textContent='转身，坐到床边';
  }, T.bed);
  later(()=>{
    const p=cur();
    patientEl.classList.add('snapsize');
    if(p) who.innerHTML=bedPerson(p.kind, mood());
    patientEl.classList.remove('to-bed');
    patientEl.classList.add('bedtime','sit');
    void patientEl.offsetWidth;
    patientEl.classList.remove('snapsize');
    bubble.textContent='坐下';
    requestAnimationFrame(()=>patientEl.classList.remove('turn'));
  }, T.bed+T.turn);
  later(()=>{
    patientEl.classList.add('lie');
    bubble.textContent='躺好';
    hintEl.textContent='慢慢躺到枕头上';
  }, T.bed+T.turn+T.sit);
  later(()=>{
    patientEl.classList.add('tucked');
    bubble.textContent='呼…';
    hintEl.textContent='盖好小被子，睡一会儿';
    LTL.beep(392,.12,'sine',.04);
    later(()=>LTL.beep(494,.14,'sine',.035),200);
  }, T.bed+T.turn+T.sit+T.lie);
  later(finishRest, T.bed+T.turn+T.sit+T.lie+T.tuck);
}
function finishRest(){
  lastStars=pending; score+=lastStars;
  step='leave'; busy=false;
  doctorEl.classList.remove('walk','using','to-patient');
  snapPatient('bye');
  LTL.beep(523,.08,'triangle',.05);
  later(()=>LTL.beep(659,.08,'triangle',.05),90);
  later(()=>LTL.beep(784,.12,'triangle',.05),180);
  floatWord(lastStars>=5?'好医生':'辛苦啦');
  renderActions();
}
function nextPatient(){
  if(busy||step!=='leave'||over) return;
  if(idx>=day.length-1) return settle();
  idx++;
  enterPatient();
}
function settle(){
  over=true; busy=false;
  clearFx();
  const rec=LTL.record('doctor', score);
  document.getElementById('ovt').textContent=rec?'新纪录，你真棒':'今天看完啦';
  document.getElementById('ovsub').textContent=score>=25?'每一位都照顾得很好':'小病人都回家休息啦';
  document.getElementById('ovscore').textContent=score+' 星';
  ov.classList.add('show');
  actions.innerHTML='';
  hintEl.textContent=hintFor();
  rate.hidden=true;
  LTL.beep(523,.08,'triangle',.05);
  later(()=>LTL.beep(659,.08,'triangle',.05),120);
  later(()=>LTL.beep(880,.12,'triangle',.05),240);
}
function choices(med){
  const others=shuffle(MEDS.filter(m=>m.id!==med));
  return shuffle([MEDS.find(m=>m.id===med), others[0], others[1]]);
}
function makeDay(){
  const kinds=shuffle(KINDS.concat(['kid','adult']));
  return shuffle(CASES.map((c,i)=>({...c, kind:kinds[i], opts:choices(c.med)})));
}
function start(){
  clearTimers(); clearFx();
  day=makeDay(); idx=0; score=0; okPick=false; over=false; lastStars=0;
  ov.classList.remove('show'); rate.hidden=true;
  doctorEl.className='doctor';
  enterPatient();
}
actions.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||over||b.disabled) return;
  const act=b.dataset.act;
  if(act==='listen') listen();
  else if(act==='med') pick(b.dataset.med);
  else if(act==='rest') rest();
  else if(act==='next') nextPatient();
});
patientEl.addEventListener('click',()=>{if(step==='enter'||step==='listen') listen()});
doctorEl.addEventListener('click',()=>{if(step==='enter'||step==='listen') listen()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  if(e.target.closest('button,a,input')) return;
  const b=actions.querySelector('button:not(:disabled)');
  if(b){e.preventDefault(); b.click()}
});
document.getElementById('restart').onclick=start;
document.getElementById('again').onclick=start;
window.__DOC={
  start, listen, pick, rest, next:nextPatient,
  get state(){const p=cur()||{}; return {idx,step,score,over,okPick,lastStars,tries,busy,pending,queued:!!queued,sym:p.sym,med:p.med,kind:p.kind,name:p.name,n:day.length}}
};
start();
