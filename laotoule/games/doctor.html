<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>医院小医生 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:480px;padding:6px 8px 8px}
.hud{text-align:center;font-size:1.28rem;font-weight:900;margin:0 0 4px}
.hud b{color:#c92a2a}
.rule{margin:0 0 4px;background:#fff;border:3px solid #222;border-radius:14px;padding:4px 8px;font-size:1.02rem;font-weight:800;line-height:1.3;text-align:center}
.clinic{position:relative;flex:1;min-height:210px;border:4px solid #222;border-radius:18px;overflow:hidden;background:linear-gradient(#d0ebff 0 58%,#f8f1e3 58% 72%,#e7c48a 72%)}
.door{position:absolute;right:10px;top:8px;width:58px;height:86px;background:#e8590c;border:3px solid #222;border-radius:8px 8px 0 0;z-index:1}
.door span{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#fff;font-size:.85rem;font-weight:900}
.door i{position:absolute;right:8px;top:40px;width:8px;height:8px;border-radius:50%;background:#ffd43b;border:2px solid #222}
.bed,.chair,.cabinet,.doctor,.patient{position:absolute;z-index:2}
.bed{left:6px;bottom:8px;width:46%;height:34%}
.bed svg,.chair svg,.cabinet svg,.doctor svg,.patient .who{width:100%;height:100%;display:block}
.chair{left:48%;bottom:10px;width:16%;height:24%}
.cabinet{right:8px;bottom:18%;width:24%;height:46%;z-index:1}
.doctor{left:4px;bottom:12px;width:78px;height:118px;z-index:3}
.patient{left:58%;bottom:14px;width:92px;height:158px;z-index:4;transition:left .35s ease,bottom .35s ease}
.patient.exam{left:34%}
.patient.rest{left:8%;bottom:28%}
.patient.out{left:78%;bottom:14px}
.patient .who{position:absolute;left:0;right:0;bottom:0;height:78%}
.bubble{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border:3px solid #222;border-radius:16px;padding:2px 8px;font-weight:900;font-size:1.15rem;white-space:nowrap;box-shadow:0 3px 0 #222;z-index:5}
.bubble svg{width:28px;height:28px;vertical-align:-8px}
.queue{position:absolute;left:8px;top:8px;background:#fff;border:3px solid #222;border-radius:12px;padding:1px 8px;font-weight:900;font-size:.95rem;z-index:5}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.actions .btn{min-height:58px;min-width:104px;font-size:1.15rem}
.rate{margin-top:6px;text-align:center;background:#fff;border:3px solid #222;border-radius:14px;padding:4px 8px;font-weight:900}
.rate .starline{font-size:1.8rem;letter-spacing:2px;color:#f59f00;line-height:1.1}
.rate .dim{color:#ced4da}
#ovt{font-size:1.6rem;font-weight:900}
#ovscore{font-size:2.4rem;font-weight:900;color:#e8590c}
.tools{display:flex;justify-content:center;margin-top:6px}
.tools .btn{min-height:48px}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>🩺 医院小医生</h1></div>
<div class="wrap">
<div class="hud">第 <b id="num">1</b> / 5 位 · 今天 <b id="score">0</b> 星</div>
<p class="rule">先听诊，再选药或创可贴，然后让病人上床休息。<br>离开时会打星。看完今天的病人，就结算总分。</p>
<div class="clinic" id="clinic">
  <div class="queue" id="queue">门口还有 4 位</div>
  <div class="door"><i></i><span>门</span></div>
  <div class="cabinet" aria-hidden="true"><svg viewBox="0 0 80 130"><rect x="4" y="4" width="72" height="122" rx="4" fill="#fff" stroke="#222" stroke-width="3"/><path d="M8 44h64M8 86h64" stroke="#222" stroke-width="3"/><rect x="14" y="14" width="14" height="22" rx="4" fill="#ff6b6b" stroke="#222" stroke-width="2"/><rect x="34" y="16" width="12" height="20" rx="4" fill="#69db7c" stroke="#222" stroke-width="2"/><rect x="52" y="18" width="12" height="18" rx="6" fill="#74c0fc" stroke="#222" stroke-width="2"/><rect x="16" y="54" width="16" height="22" rx="3" fill="#ffd43b" stroke="#222" stroke-width="2"/><rect x="40" y="52" width="22" height="24" rx="3" fill="#fff" stroke="#e03131" stroke-width="3"/><path d="M46 64h10M51 59v10" stroke="#e03131" stroke-width="2"/><text x="40" y="112" font-size="14" font-weight="700" fill="#222">药柜</text></svg></div>
  <div class="bed" aria-hidden="true"><svg viewBox="0 0 180 100"><rect x="16" y="48" width="150" height="26" rx="6" fill="#f8f9fa" stroke="#222" stroke-width="3"/><rect x="18" y="34" width="40" height="22" rx="5" fill="#fff" stroke="#222" stroke-width="3"/><rect x="8" y="72" width="164" height="12" rx="3" fill="#e67700" stroke="#222" stroke-width="3"/><rect x="14" y="84" width="10" height="14" fill="#222"/><rect x="156" y="84" width="10" height="14" fill="#222"/><text x="70" y="66" font-size="16" font-weight="700" fill="#868e96">病床</text></svg></div>
  <div class="chair" aria-hidden="true"><svg viewBox="0 0 70 90"><rect x="16" y="8" width="38" height="36" rx="6" fill="#ffd43b" stroke="#222" stroke-width="3"/><rect x="12" y="42" width="46" height="12" rx="3" fill="#fab005" stroke="#222" stroke-width="3"/><rect x="16" y="54" width="6" height="28" fill="#222"/><rect x="48" y="54" width="6" height="28" fill="#222"/></svg></div>
  <div class="doctor" aria-label="医生"><svg viewBox="0 0 80 130"><circle cx="40" cy="24" r="16" fill="#ffd8a8" stroke="#222" stroke-width="3"/><path d="M24 22 q16-18 32 0" fill="#343a40"/><circle cx="34" cy="24" r="2" fill="#222"/><circle cx="46" cy="24" r="2" fill="#222"/><path d="M34 30 q6 4 12 0" fill="none" stroke="#222" stroke-width="2"/><path d="M22 42 h36 v40 h-36 z" fill="#f8f9fa" stroke="#222" stroke-width="3"/><path d="M40 46 v28" stroke="#74c0fc" stroke-width="3"/><circle cx="40" cy="78" r="7" fill="#4dabf7" stroke="#222" stroke-width="3"/><path d="M28 48 q-16 10-8 28" fill="none" stroke="#4dabf7" stroke-width="3"/><rect x="28" y="82" width="24" height="28" fill="#1971c2" stroke="#222" stroke-width="3"/></svg></div>
  <div class="patient exam" id="patient"><div class="bubble" id="bubble"></div><div class="who" id="who"></div></div>
  <div class="overlay" id="ov"><div id="ovt">今天看完啦</div><div id="ovscore">0 星</div><button class="btn" id="again" type="button">再开一天</button></div>
</div>
<div class="rate" id="rate" hidden></div>
<div class="actions" id="actions"></div>
<div class="tools"><button class="btn" id="restart" type="button">重开今天</button></div>
</div>
<script src="../common.js"></script>
<script>
const MEDS=[
  {id:'fever',name:'退烧药',bg:'#ffc9c9'},
  {id:'cough',name:'止咳药',bg:'#d0bfff'},
  {id:'tummy',name:'肚痛药',bg:'#b2f2bb'},
  {id:'band',name:'创可贴',bg:'#fff3bf'},
  {id:'head',name:'止痛药',bg:'#a5d8ff'}
];
const CASES=[
  {sym:'fever',name:'发烧',med:'fever'},
  {sym:'cough',name:'咳嗽',med:'cough'},
  {sym:'tummy',name:'肚子疼',med:'tummy'},
  {sym:'cut',name:'擦伤',med:'band'},
  {sym:'head',name:'头疼',med:'head'}
];
const KINDS=['kid','adult','elder'];
const ICONS={
  fever:'<svg viewBox="0 0 32 32" aria-label="发烧"><rect x="14" y="4" width="6" height="20" rx="3" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="17" cy="26" r="5" fill="#e03131" stroke="#222" stroke-width="2"/><rect x="16" y="14" width="2" height="8" fill="#e03131"/></svg>',
  cough:'<svg viewBox="0 0 32 32" aria-label="咳嗽"><circle cx="14" cy="16" r="8" fill="#fff" stroke="#222" stroke-width="2"/><path d="M22 10 q8 2 4 8 M24 16 q8 2 2 8" fill="none" stroke="#1971c2" stroke-width="2"/></svg>',
  tummy:'<svg viewBox="0 0 32 32" aria-label="肚子疼"><circle cx="16" cy="18" r="10" fill="#ffd8a8" stroke="#222" stroke-width="2"/><path d="M10 18 q6 6 12 0" fill="none" stroke="#e03131" stroke-width="2"/></svg>',
  cut:'<svg viewBox="0 0 32 32" aria-label="擦伤"><rect x="4" y="12" width="24" height="10" rx="3" fill="#fff" stroke="#222" stroke-width="2"/><path d="M16 12 v10 M10 17 h12" stroke="#e03131" stroke-width="2"/></svg>',
  head:'<svg viewBox="0 0 32 32" aria-label="头疼"><circle cx="16" cy="18" r="9" fill="#ffd8a8" stroke="#222" stroke-width="2"/><path d="M16 4 l2 6 h-4 z" fill="#fab005" stroke="#222" stroke-width="2"/></svg>'
};
function person(kind,mood){
  const kid=kind==='kid', elder=kind==='elder';
  const hair=elder?'#dee2e6':kid?'#f59f00':'#343a40';
  const shirt=kid?'#ff922b':elder?'#e599f7':'#4dabf7';
  const smile=mood==='happy'?'M30 30 q6 6 12 0':mood==='sad'?'M30 34 q6-5 12 0':'M32 31 h8';
  const scale=kid?0.82:elder?0.96:1;
  const cane=elder?'<path d="M58 40 q10 8 4 36" fill="none" stroke="#8d5524" stroke-width="3"/>':'';
  return `<svg viewBox="0 0 80 110" aria-label="${kind==='kid'?'小孩':elder?'老人':'大人'}" style="transform:scale(${scale});transform-origin:50% 100%"><circle cx="36" cy="24" r="${kid?16:14}" fill="#ffd8a8" stroke="#222" stroke-width="3"/><path d="M22 20 q14-16 28 2" fill="${hair}"/><circle cx="31" cy="24" r="2" fill="#222"/><circle cx="41" cy="24" r="2" fill="#222"/>${elder?'<path d="M26 24 h8 M38 24 h8" stroke="#222" stroke-width="2"/>':''}<path d="${smile}" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/><path d="M20 42 h32 v34 h-32 z" fill="${shirt}" stroke="#222" stroke-width="3"/><rect x="24" y="76" width="10" height="26" fill="#364fc7" stroke="#222" stroke-width="3"/><rect x="38" y="76" width="10" height="26" fill="#364fc7" stroke="#222" stroke-width="3"/>${cane}</svg>`;
}
function shuffle(a){const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0; const t=b[i]; b[i]=b[j]; b[j]=t} return b}
const patientEl=document.getElementById('patient'), bubble=document.getElementById('bubble'), who=document.getElementById('who');
const actions=document.getElementById('actions'), rate=document.getElementById('rate'), queueEl=document.getElementById('queue');
const numEl=document.getElementById('num'), scoreEl=document.getElementById('score'), ov=document.getElementById('ov');
let day=[], idx=0, step='listen', score=0, okPick=false, over=false, lastStars=0;
function choices(med){
  const others=shuffle(MEDS.filter(m=>m.id!==med));
  return shuffle([MEDS.find(m=>m.id===med), others[0], others[1]]);
}
function cur(){return day[idx]}
function renderPatient(){
  const p=cur();
  who.innerHTML=person(p.kind, step==='leave'?(okPick?'happy':'sad'):'wait');
  bubble.innerHTML=ICONS[p.sym]+p.name;
  numEl.textContent=idx+1;
  scoreEl.textContent=score;
  queueEl.textContent='门口还有 '+(day.length-1-idx)+' 位';
}
function btn(label, attrs, bg){
  return `<button class="btn" type="button" ${attrs} style="${bg?'background:'+bg:''}">${label}</button>`;
}
function renderActions(){
  rate.hidden=step!=='leave';
  patientEl.classList.toggle('exam', step==='listen'||step==='med'||step==='rest');
  patientEl.classList.toggle('rest', step==='leave');
  patientEl.classList.toggle('out', false);
  if(step==='listen') actions.innerHTML=btn('听诊','id="listen" data-act="listen"','#c3fae8');
  else if(step==='med') actions.innerHTML=cur().opts.map(m=>btn(m.name,`data-act="med" data-med="${m.id}"`,m.bg)).join('');
  else if(step==='rest') actions.innerHTML=btn('去休息','data-act="rest"','#d0ebff');
  else {
    const full='★★★★★', on=full.slice(0,lastStars), off=full.slice(lastStars);
    rate.innerHTML=`<div>${okPick?'高兴地离开':'不太高兴，也回家了'}</div><div class="starline">${on}<span class="dim">${off}</span></div><div>这位打了 ${lastStars} 星</div>`;
    actions.innerHTML=btn(idx>=day.length-1?'看今天的成绩':'下一位','data-act="next"','#ffd43b');
  }
  renderPatient();
}
function listen(){step='med'; LTL.beep(660,.08,'sine',.05); LTL.toast('听到了：'+cur().name); renderActions()}
function pick(id){
  okPick=id===cur().med;
  step='rest';
  LTL.beep(okPick?760:180, .1, okPick?'triangle':'square', .05);
  LTL.toast(okPick?'药选对啦':'这个不太对，也让病人去休息');
  renderActions();
}
function rest(){
  lastStars=okPick?5:2;
  score+=lastStars;
  step='leave';
  LTL.beep(okPick?880:300,.12,'triangle',.05);
  renderActions();
}
function nextPatient(){
  if(idx>=day.length-1) return settle();
  idx++; step='listen'; okPick=false;
  patientEl.classList.remove('rest');
  renderActions();
}
function settle(){
  over=true;
  if(LTL.record('doctor', score)){}
  document.getElementById('ovt').textContent='今天看完啦';
  document.getElementById('ovscore').textContent=score+' 星';
  ov.classList.add('show');
  LTL.beep(520,.08,'triangle',.05); setTimeout(()=>LTL.beep(680,.1,'triangle',.05),120);
}
function makeDay(){
  const kinds=shuffle(KINDS.concat(['kid','adult']));
  return shuffle(CASES.map((c,i)=>({...c, kind:kinds[i], opts:choices(c.med)})));
}
function start(){
  day=makeDay(); idx=0; step='listen'; score=0; okPick=false; over=false; lastStars=0;
  ov.classList.remove('show'); rate.hidden=true;
  renderActions();
}
actions.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||over) return;
  const act=b.dataset.act;
  if(act==='listen'&&step==='listen') listen();
  else if(act==='med'&&step==='med') pick(b.dataset.med);
  else if(act==='rest'&&step==='rest') rest();
  else if(act==='next'&&step==='leave') nextPatient();
});
document.getElementById('restart').onclick=start;
document.getElementById('again').onclick=start;
window.__DOC={
  start,
  listen, pick, rest, next:nextPatient,
  get state(){const p=cur()||{}; return {idx,step,score,over,okPick,lastStars,sym:p.sym,med:p.med,kind:p.kind,name:p.name,n:day.length}}
};
start();
</script></body></html>
