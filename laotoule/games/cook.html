<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>煮饭认菜 - 老头乐游戏厅</title><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#e8590c">
<style>
.wrap{padding:8px 10px 12px}
.stats{margin:0 0 6px}
.plate{background:#fff;border:4px solid #222;border-radius:24px;box-shadow:0 6px 0 #222;text-align:center;padding:6px 8px 10px}
.plate h2{margin:0;font-size:2rem;line-height:1.2}
.plate svg.dish{width:min(70vw,240px);height:auto;display:block;margin:0 auto}
.ask{text-align:center;font-size:1.35rem;font-weight:900;margin:8px 0}
#opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;min-height:84px;justify-content:flex-start;gap:12px;font-size:1.7rem;background:#fff;padding:6px 14px}
.opt svg{width:68px;height:68px;flex:none}
.opt.good{background:#8ce99a}
.opt.bad{animation:cookshake .4s}
@keyframes cookshake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.stage{position:relative}
.overlay{border-radius:24px}
</style></head><body>
<div class="topbar"><a class="btn" href="../index.html">← 返回</a><h1>🍲 煮饭认菜</h1></div>
<div class="wrap">
<div class="stats">
  <div class="stat"><span>得分</span><b id="score">0</b></div>
  <div class="stat"><span>这是第几道</span><b id="step">1 / 14</b></div>
  <div class="stat"><span>最高</span><b id="best">0</b></div>
</div>
<div class="stage">
  <div class="plate"><div id="food"></div><h2 id="dname">番茄炒蛋</h2></div>
  <p class="ask" id="ask">这道菜用的是哪一种？</p>
  <div id="opts"></div>
  <div class="overlay" id="ov"><div id="ovt">都认出来啦</div><button class="btn green" id="again" type="button">再来一回</button></div>
</div>
<div class="controls"><button class="btn" id="restart" type="button">🔄 重新开始</button></div>
<div class="help"><h2>📖 怎么玩</h2><ul>
<li>上面是一道菜的大图和名字。下面点出这道菜用到的那一种菜。</li>
<li>点对了会说「对啦」，再换下一道。点错了可以再点，不扣分。</li>
<li>一共 14 道家常菜，图画都是新画的。</li>
</ul></div>
</div>
<script src="../common.js"></script>
<script>
const ICONS={
tomato:'<svg viewBox="0 0 100 100"><circle cx="50" cy="58" r="30" fill="#e03131" stroke="#222" stroke-width="4"/><path d="M50 28c-12 8-8 16 0 16s12-8 0-16z" fill="#2f9e44" stroke="#222" stroke-width="3"/><path d="M32 34c12 4 24 4 36 0" fill="none" stroke="#2b8a3e" stroke-width="4" stroke-linecap="round"/></svg>',
greens:'<svg viewBox="0 0 100 100"><path d="M50 86L28 34Q50 16 50 42Q50 16 72 34Z" fill="#2f9e44" stroke="#222" stroke-width="4"/><path d="M50 84L40 46M50 84L60 46" stroke="#fff" stroke-width="3"/><rect x="43" y="72" width="14" height="16" rx="4" fill="#e6fcf5" stroke="#222" stroke-width="3"/></svg>',
potato:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="56" rx="34" ry="26" fill="#e6c07b" stroke="#222" stroke-width="4"/><circle cx="36" cy="50" r="3.2" fill="#6b3e12"/><circle cx="58" cy="62" r="3.2" fill="#6b3e12"/><circle cx="48" cy="42" r="2.6" fill="#6b3e12"/></svg>',
cucumber:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="52" rx="16" ry="34" fill="#37b24d" stroke="#222" stroke-width="4" transform="rotate(-18 50 52)"/><path d="M40 28c10 12 16 28 14 46" fill="none" stroke="#087f5b" stroke-width="3" stroke-linecap="round"/></svg>',
corn:'<svg viewBox="0 0 100 100"><path d="M32 34Q22 58 36 82L50 90L64 82Q78 58 68 34Z" fill="#fab005" stroke="#222" stroke-width="4"/><path d="M34 32Q50 10 66 32" fill="#2f9e44" stroke="#222" stroke-width="3"/><g fill="#fff3bf" stroke="#e67700" stroke-width="1.4"><circle cx="44" cy="48" r="4.2"/><circle cx="56" cy="48" r="4.2"/><circle cx="50" cy="60" r="4.2"/><circle cx="44" cy="72" r="4.2"/><circle cx="56" cy="72" r="4.2"/></g></svg>',
pumpkin:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="34" ry="24" fill="#f76707" stroke="#222" stroke-width="4"/><path d="M50 40v44M34 52c8 14 10 18 16 20M66 52c-8 14-10 18-16 20" fill="none" stroke="#d9480f" stroke-width="3"/><rect x="45" y="22" width="10" height="18" rx="3" fill="#2f9e44" stroke="#222" stroke-width="3"/></svg>',
carrot:'<svg viewBox="0 0 100 100"><path d="M50 34L72 44L50 92L28 44Z" fill="#f76707" stroke="#222" stroke-width="4"/><path d="M50 34c-18-14-6-10 0-24M50 34c18-14 6-10 0-24M50 34c-4-16 8-16 2-26" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/></svg>',
cabbage:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="32" ry="26" fill="#e6fcf5" stroke="#222" stroke-width="4"/><ellipse cx="50" cy="60" rx="18" ry="16" fill="#b2f2bb" stroke="#087f5b" stroke-width="3"/><path d="M26 42c10-22 38-22 48 0" fill="#69db7c" stroke="#222" stroke-width="3"/></svg>',
eggplant:'<svg viewBox="0 0 100 100"><path d="M38 42Q32 90 50 92Q68 90 62 42Q50 28 38 42Z" fill="#7048e8" stroke="#222" stroke-width="4"/><path d="M34 42Q50 24 66 42Q50 34 34 42Z" fill="#2f9e44" stroke="#222" stroke-width="3"/></svg>',
mushroom:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="46" rx="34" ry="20" fill="#a86b3c" stroke="#222" stroke-width="4"/><rect x="42" y="48" width="16" height="30" rx="6" fill="#fff4e6" stroke="#222" stroke-width="4"/><circle cx="34" cy="44" r="4" fill="#ffe8cc"/><circle cx="62" cy="40" r="3.2" fill="#ffe8cc"/></svg>',
radish:'<svg viewBox="0 0 100 100"><path d="M40 40Q34 78 50 92Q66 78 60 40Z" fill="#fff" stroke="#222" stroke-width="4"/><path d="M50 40c-16-8-18-22-6-30M50 40c2-18 8-24 12-32M50 40c14-8 18-20 10-28" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/></svg>',
broccoli:'<svg viewBox="0 0 100 100"><rect x="44" y="58" width="12" height="26" rx="4" fill="#c0eb75" stroke="#222" stroke-width="3"/><g fill="#2f9e44" stroke="#222" stroke-width="3"><circle cx="34" cy="50" r="14"/><circle cx="58" cy="46" r="16"/><circle cx="46" cy="32" r="13"/><circle cx="66" cy="60" r="11"/></g></svg>',
pea:'<svg viewBox="0 0 100 100"><path d="M16 58Q50 12 84 58Q50 80 16 58Z" fill="#8ce99a" stroke="#222" stroke-width="4"/><g fill="#2f9e44" stroke="#222" stroke-width="2"><circle cx="34" cy="54" r="7"/><circle cx="50" cy="50" r="7"/><circle cx="66" cy="54" r="7"/></g></svg>',
onion:'<svg viewBox="0 0 100 100"><circle cx="50" cy="56" r="30" fill="#eebefa" stroke="#222" stroke-width="4"/><circle cx="50" cy="56" r="18" fill="none" stroke="#9c36b5" stroke-width="3"/><circle cx="50" cy="56" r="8" fill="none" stroke="#9c36b5" stroke-width="3"/><path d="M38 30c6 8 18 8 24 0" fill="none" stroke="#e67700" stroke-width="3"/><path d="M42 86h6M54 86h6" stroke="#8d5524" stroke-width="3" stroke-linecap="round"/></svg>'
};
const NAMES={tomato:'番茄',greens:'青菜',potato:'土豆',cucumber:'黄瓜',corn:'玉米',pumpkin:'南瓜',carrot:'胡萝卜',cabbage:'白菜',eggplant:'茄子',mushroom:'蘑菇',radish:'白萝卜',broccoli:'西兰花',pea:'豌豆',onion:'洋葱'};
const DISHES=[
  {name:'番茄炒蛋',veg:'tomato'},
  {name:'炒青菜',veg:'greens'},
  {name:'炒土豆丝',veg:'potato'},
  {name:'拍黄瓜',veg:'cucumber'},
  {name:'煮玉米',veg:'corn'},
  {name:'南瓜粥',veg:'pumpkin'},
  {name:'炒胡萝卜',veg:'carrot'},
  {name:'白菜汤',veg:'cabbage'},
  {name:'红烧茄子',veg:'eggplant'},
  {name:'蘑菇汤',veg:'mushroom'},
  {name:'萝卜汤',veg:'radish'},
  {name:'炒西兰花',veg:'broccoli'},
  {name:'炒豌豆',veg:'pea'},
  {name:'炒洋葱',veg:'onion'}
];
const IDS=Object.keys(NAMES);
let order=[],idx=0,score=0,busy=false;
const food=document.getElementById('food'),dname=document.getElementById('dname'),opts=document.getElementById('opts');
const scoreEl=document.getElementById('score'),stepEl=document.getElementById('step'),bestEl=document.getElementById('best'),ov=document.getElementById('ov');
function plate(id){
  return '<svg class="dish" viewBox="0 0 200 156">'+
    '<ellipse cx="100" cy="136" rx="78" ry="12" fill="#dee2e6" stroke="#222" stroke-width="3"/>'+
    '<ellipse cx="100" cy="118" rx="74" ry="18" fill="#fff" stroke="#222" stroke-width="4"/>'+
    '<path d="M70 26c4 10 4 14 0 20M100 16c4 12 4 16 0 22M130 26c4 10 4 14 0 20" fill="none" stroke="#adb5bd" stroke-width="3" stroke-linecap="round"/>'+
    '<g transform="translate(50,18) scale(1)">'+ICONS[id]+'</g></svg>';
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=b[i];b[i]=b[j];b[j]=t}return b}
function choices(correct){
  const pool=shuffle(IDS.filter(id=>id!==correct)).slice(0,2);
  return shuffle(pool.concat(correct));
}
function show(){
  busy=false;
  ov.classList.remove('show');
  const d=DISHES[order[idx]];
  dname.textContent=d.name;
  food.innerHTML=plate(d.veg);
  stepEl.textContent=(idx+1)+' / '+DISHES.length;
  opts.innerHTML='';
  choices(d.veg).forEach(id=>{
    const b=document.createElement('button');
    b.type='button';b.className='btn opt';b.dataset.id=id;
    b.innerHTML=ICONS[id]+'<span>'+NAMES[id]+'</span>';
    b.onclick=()=>pick(id,b);
    opts.appendChild(b);
  });
}
function pick(id,btn){
  if(busy)return;
  const d=DISHES[order[idx]];
  if(id!==d.veg){
    btn.classList.remove('bad');void btn.offsetWidth;btn.classList.add('bad');
    LTL.toast('再看看，这道菜用的不是'+NAMES[id]);
    LTL.beep(180,.08,'square',.04);
    return;
  }
  busy=true;
  btn.classList.add('good');
  score++;scoreEl.textContent=score;
  if(LTL.record('cook',score))bestEl.textContent=score;
  LTL.beep(660,.1,'triangle',.06);
  document.getElementById('ask').textContent='对啦！是'+NAMES[id];
  setTimeout(()=>{
    document.getElementById('ask').textContent='这道菜用的是哪一种？';
    if(idx>=DISHES.length-1){
      document.getElementById('ovt').textContent='14 道菜都认出来啦！得分 '+score;
      ov.classList.add('show');
      LTL.beep(784,.16,'triangle',.06);
      return;
    }
    idx++;show();
  },650);
}
function restart(){
  order=DISHES.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=order[i];order[i]=order[j];order[j]=t}
  idx=0;score=0;scoreEl.textContent='0';
  document.getElementById('ask').textContent='这道菜用的是哪一种？';
  show();
}
document.getElementById('restart').onclick=restart;
document.getElementById('again').onclick=restart;
bestEl.textContent=LTL.getBest('cook');
order=DISHES.map((_,i)=>i);
show();
window.__COOK={
  get score(){return score},get idx(){return idx},
  dish(){const d=DISHES[order[idx]];return {name:d.name,veg:d.veg,label:NAMES[d.veg]}},
  options(){return [...opts.querySelectorAll('.opt')].map(b=>({id:b.dataset.id,name:b.textContent}))},
  pick(id){const b=[...opts.querySelectorAll('.opt')].find(x=>x.dataset.id===id);if(b)b.click()}
};
</script></body></html>
