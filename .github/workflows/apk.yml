name: Build offline APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _laotoule_apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed release APK
        working-directory: _laotoule_apk
        run: |
          npm ci
          npm run build:apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < laotoule/VERSION)
          cp _laotoule_apk/android/app/build/outputs/apk/release/app-release.apk laotoule-offline.apk
          cp laotoule-offline.apk "laotoule-v${VER}.apk"
          printf '%s\n' \
            "老头乐游戏厅 v${VER} 的离线安卓安装包。" \
            '' \
            '全部游戏资源都打在 APK 里，安装后不需要网络。使用 debug 证书签名，可以直接侧载安装。' \
            '' \
            "这一版的 Release 是 apk-v${VER}，以后会一直留着。" \
            'apk-v1 和 Latest 下载地址始终指向当前最新的安装包。' \
            > /tmp/apk-notes.md
          publish() {
            local tag="$1" latest="$2"
            shift 2
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$@" --clobber
              gh release edit "$tag" --target "$GITHUB_SHA" --latest="$latest" --title "老头乐游戏厅 ${tag}" --notes-file /tmp/apk-notes.md
            else
              gh release create "$tag" "$@" --target "$GITHUB_SHA" --latest="$latest" --title "老头乐游戏厅 ${tag}" --notes-file /tmp/apk-notes.md
            fi
          }
          publish "apk-v${VER}" true "laotoule-v${VER}.apk" laotoule-offline.apk
          publish apk-v1 false laotoule-offline.apk
